<style>
:root {
  --bg: #F1F3F5;
  --card: #FFFFFF;
  --line: #D8DDE2;
  --line-soft: #E8ECEF;
  --ink: #0F1720;
  --ink-2: #2A3540;
  --muted: #5A6570;
  --accent: #0A6B73;        /* unico colore per azioni e link */
  --accent-press: #07555C;
  --accent-soft: #E2F1F1;
  --rain: #1E6FD0;          /* probabilità di pioggia */
  --ok: #1F7A3A; --ok-bg: #E4F4E8;
  --warn: #8A5A00; --warn-bg: #FFF1CC;
  --bad: #A8231A; --bad-bg: #FDE5E2;
  --info: #1E5FB0; --info-bg: #E3EEFB;
  --r: 12px;
  --gut: 16px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: var(--accent); }
button { font: inherit; }
.svgdefs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- testata ---------- */
.proposta { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .02em;
  padding: calc(env(safe-area-inset-top) + 4px) 16px 2px; background: #fff; }
header.top { background: #fff; border-bottom: 1px solid var(--line); padding: 6px var(--gut) 10px;
  padding-left: max(var(--gut), env(safe-area-inset-left)); padding-right: max(var(--gut), env(safe-area-inset-right));
  position: sticky; top: 0; z-index: 5; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.marca svg { width: 26px; height: 26px; flex: none; }
.marca .agg { margin-left: auto; font-weight: 500; font-size: 13px; color: var(--muted); white-space: nowrap; }
.luogo-bar { margin-top: 8px; display: flex; align-items: center; gap: 8px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.luogo-bar svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
.luogo-bar .l1 { font-size: 13px; color: var(--muted); white-space: nowrap; }
.luogo-bar .l2 { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px calc(-1 * var(--gut)) 0; padding: 0 var(--gut); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 999px;
  padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-press); }

.saluto { max-width: 560px; margin: 0 auto; padding: 14px var(--gut) 0; padding-left: max(var(--gut), env(safe-area-inset-left)); padding-right: max(var(--gut), env(safe-area-inset-right));
  font-size: 20px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saluto + main { padding-top: 10px; }
main { padding: 12px var(--gut) 24px; padding-left: max(var(--gut), env(safe-area-inset-left)); padding-right: max(var(--gut), env(safe-area-inset-right));
  max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card h2 { margin: 0 0 2px; font-size: 20px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
.card .sotto-h { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.h-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.h-row a { font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }

/* ---------- adesso ---------- */
.hero { padding: 16px 14px 14px; position: relative; overflow: hidden; }
.hero .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.hero-main { display: flex; align-items: center; gap: 10px; }
.hero-ico { width: 92px; height: 92px; flex: none; margin-left: -6px; }
.hero-t { font-size: 68px; line-height: 1; font-weight: 800; letter-spacing: -.04em; }
.hero-cond { font-size: 19px; font-weight: 700; margin-top: 4px; }
.hero-feel { font-size: 15px; color: var(--ink-2); }
.termo { height: 6px; border-radius: 3px; margin: 12px 0 10px; background: var(--line-soft); position: relative; }
.termo i { position: absolute; top: -4px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); transform: translateX(-50%); }
.hero-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { border: 1px solid var(--line-soft); border-radius: 10px; padding: 7px 8px; background: rgba(255,255,255,.7); }
.fact b { display: block; font-size: 17px; }
.fact span { font-size: 12px; color: var(--muted); }
.sintesi { margin: 12px 0 0; font-size: 15px; color: var(--ink-2); }
.sintesi b { color: var(--ink); }

/* ---------- pillole ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 12.5px; font-weight: 700; white-space: nowrap; line-height: 1.3; }
.p-oggi { background: var(--ink); color: #fff; }
.p-ok { background: var(--ok-bg); color: var(--ok); }
.p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); }
.p-info { background: var(--info-bg); color: var(--info); }
.p-grey { background: var(--line-soft); color: var(--ink-2); }

/* ---------- risposte ---------- */
.risposte { list-style: none; margin: 0; padding: 0; }
.risposta { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); align-items: start; }
.risposta:first-child { border-top: 0; padding-top: 4px; }
.r-ico { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; }
.r-ico svg { width: 26px; height: 26px; }
.r-tit { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.r-tit strong { font-size: 17px; line-height: 1.25; font-weight: 800; }
.r-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.r-why { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.r-why::before { content: "Perché: "; font-weight: 700; color: var(--ink-2); }

.cta { display: grid; gap: 8px; margin-top: 12px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 10px;
  font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer; border: 0; padding: 0 16px; }
.btn svg { width: 20px; height: 20px; }
.btn-pri { background: var(--accent); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.btn-pri:active { background: var(--accent-press); }
.btn-sec { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }

/* ---------- 24 ore ---------- */
.ore { display: flex; gap: 0; overflow-x: auto; margin: 0 -14px; padding: 2px 8px 4px; scroll-snap-type: x proximity; scrollbar-width: none; }
.ore::-webkit-scrollbar { display: none; }
.ora { flex: none; width: 62px; text-align: center; padding: 8px 2px; border-radius: 10px; scroll-snap-align: start; }
.ora.adesso { background: var(--accent-soft); }
.ora .o-h { font-size: 13px; color: var(--muted); font-weight: 600; }
.ora.adesso .o-h { color: var(--accent-press); font-weight: 800; }
.ora .o-dd { font-size: 10.5px; color: var(--muted); height: 14px; text-transform: uppercase; letter-spacing: .03em; }
.ora svg { width: 38px; height: 38px; display: block; margin: 2px auto; }
.ora .o-t { font-size: 17px; font-weight: 800; }
.ora .o-tc { height: 4px; width: 26px; margin: 3px auto 5px; border-radius: 2px; }
.ora .o-p { font-size: 12.5px; font-weight: 700; color: var(--rain); display: flex; align-items: center; justify-content: center; gap: 2px; height: 18px; }
.ora .o-p.zero { color: #A4ADB5; font-weight: 600; }
.ora .o-p svg { width: 10px; height: 12px; margin: 0; }
.ora.sole-ev .o-t { font-size: 13px; font-weight: 700; padding-top: 3px; }
.legenda { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legenda span { display: inline-flex; align-items: center; gap: 5px; }
.legenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- 10 giorni ---------- */
.giorni { list-style: none; margin: 0; padding: 0; }
.giorno { display: grid; grid-template-columns: 62px 32px 44px 30px 1fr 30px 10px; align-items: center; gap: 6px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
.giorni li:first-child .giorno { border-top: 0; }
/* ogni giorno è un pulsante: apre il pop-up con le ore (giorno.js) */
button.giorno { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 0; }
button.giorno:active { background: var(--accent-soft); }
.giorno > span { display: block; }
.g-apri { color: #A4ADB5; font-size: 20px; line-height: 1; text-align: right; }
.g-d { font-weight: 700; font-size: 15px; line-height: 1.15; }
.g-d small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.giorno svg.gi { width: 32px; height: 32px; }
.g-p { font-size: 13px; font-weight: 700; color: var(--rain); text-align: left; }
.g-p.zero { color: #A4ADB5; font-weight: 600; }
.g-min { text-align: right; color: var(--muted); font-weight: 600; font-size: 15px; }
.g-max { font-weight: 800; font-size: 15px; }
.g-bar { height: 6px; border-radius: 3px; background: var(--line-soft); position: relative; }
.g-bar b { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.g-bar i { position: absolute; top: -3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2.5px solid var(--ink); transform: translateX(-50%); }
.g-note { grid-column: 3 / -2; font-size: 12px; color: var(--muted); margin-top: -4px; }

/* ---------- dettagli ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
/* riquadri toccabili: aprono il dettaglio in index.html, la freccina a destra del titolo */
a.tile, a.card { display: block; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
a.tile:active, a.card:active { background: var(--accent-soft); }
.t-apri { margin-left: auto; font-size: 18px; line-height: 1; font-weight: 500; color: #A4ADB5; letter-spacing: 0; }
.tile .t-l { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 5px; }
.tile .t-l svg { width: 15px; height: 15px; }
.tile .t-v { font-size: 28px; font-weight: 800; line-height: 1.1; margin-top: 4px; letter-spacing: -.02em; }
.tile .t-v small { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.tile .t-s { font-size: 13px; color: var(--muted); margin-top: 4px; }
.scala { display: flex; height: 6px; border-radius: 3px; overflow: visible; margin: 8px 0 2px; position: relative; }
.scala span { flex: 1; }
.scala span:first-child { border-radius: 3px 0 0 3px; }
.scala span:last-of-type { border-radius: 0 3px 3px 0; }
.scala i { position: absolute; top: -4px; width: 4px; height: 14px; background: var(--ink); border-radius: 2px; border: 1px solid #fff; transform: translateX(-50%); }
.cpill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-top: 4px; }
.cpill i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.vento-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.vento-row svg { width: 34px; height: 34px; flex: none; }
.arco { width: 100%; height: 46px; display: block; margin-top: 4px; }
.sole-orari { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.sole-orari span small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }

/* ---------- radar ---------- */
.radar { display: grid; grid-template-columns: 1fr 86px; gap: 12px; align-items: center; }
.radar .mini { width: 86px; height: 86px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }

/* ---------- regole ---------- */
details.regole summary { cursor: pointer; font-weight: 800; font-size: 16px; list-style: none; display: flex; align-items: center; justify-content: space-between; }
details.regole summary::-webkit-details-marker { display: none; }
details.regole summary::after { content: "+"; font-size: 22px; color: var(--accent); font-weight: 600; }
details.regole[open] summary::after { content: "–"; }
details.regole ul { margin: 10px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
details.regole li { margin: 4px 0; }

/* ---------- stati ---------- */
.skel { background: linear-gradient(90deg, #E9EDF0 25%, #F5F7F8 50%, #E9EDF0 75%); background-size: 200% 100%; animation: sk 1.2s infinite linear; border-radius: 8px; }
@keyframes sk { to { background-position: -200% 0; } }
.errore { text-align: center; padding: 24px 16px; }
.errore svg { width: 56px; height: 56px; }
.errore h2 { margin: 8px 0 4px; }
.errore p { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.avviso-cache { font-size: 13px; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-weight: 600; }

footer { padding: 4px var(--gut) 28px; text-align: center; font-size: 12.5px; color: var(--muted); max-width: 560px; margin: 0 auto; }
footer p { margin: 4px 0; }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }
section[id] { scroll-margin-top: 120px; }
/* impostazioni: ingranaggio a destra nella testata (non la fa crescere) */
#mi-posto { display: inline-flex; margin: -9px -10px -9px -4px; color: var(--ink-2); }
html.mi-no-anim .skel { animation: none; }

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => typeof v === "number" && isFinite(v);
const gradi = v => num(v) ? Math.round(v) + "°" : "–";
const dec = (v, d) => num(v) ? v.toFixed(d).replace(".", ",") : "–";
const oraN = s => parseInt(s.slice(11, 13), 10);
const hm = s => s.slice(11, 16);
const giornoDi = s => s.slice(0, 10);

/* ---------- località: link > località salvate dall'app (sola lettura) > Roma ---------- */
function leggiLuoghi() {
  const p = new URLSearchParams(location.search);
  const lat = parseFloat(p.get("lat")), lon = parseFloat(p.get("lon"));
  if (isFinite(lat) && isFinite(lon)) return { lista: [{ nome: p.get("nome") || "Località", sotto: "", lat, lon }], i: 0 };
  try {
    const l = JSON.parse(localStorage.getItem("meteo.luoghi"));
    let a = JSON.parse(localStorage.getItem("meteo.attivo"));
    if (Array.isArray(l)) {
      const ok = l.filter(x => x && isFinite(parseFloat(x.lat)) && isFinite(parseFloat(x.lon)))
                 .map(x => ({ nome: String(x.nome || "Località"), sotto: x.sotto ? String(x.sotto) : "", lat: parseFloat(x.lat), lon: parseFloat(x.lon), auto: !!x.auto }));
      if (ok.length) { if (!(Number.isInteger(a) && a >= 0 && a < ok.length)) a = 0; return { lista: ok, i: a }; }
    }
  } catch (e) { /* storage non disponibile o non valido */ }
  return { lista: [{ nome: "Roma", sotto: "", lat: 41.89, lon: 12.48 }], i: 0 };
}
const LUOGHI = leggiLuoghi();
let attivo = LUOGHI.i;

/* ---------- testi ---------- */
const COND = { 0: "Sereno", 1: "Prevalentemente sereno", 2: "Parzialmente nuvoloso", 3: "Coperto", 45: "Nebbia", 48: "Nebbia",
  51: "Pioviggine", 53: "Pioviggine", 55: "Pioviggine", 56: "Pioviggine gelata", 57: "Pioviggine gelata",
  61: "Pioggia debole", 63: "Pioggia", 65: "Pioggia forte", 66: "Pioggia gelata", 67: "Pioggia gelata",
  71: "Neve debole", 73: "Neve", 75: "Neve forte", 77: "Granelli di neve", 80: "Rovesci", 81: "Rovesci", 82: "Rovesci",
  85: "Rovesci di neve", 86: "Rovesci di neve", 95: "Temporale", 96: "Temporale con grandine", 99: "Temporale con grandine" };
const cond = c => COND[c] || "—";
const isNeve = c => (c >= 71 && c <= 77) || c === 85 || c === 86;
const isPioggia = c => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
const isTemporale = c => c >= 95;
const isNebbia = c => c === 45 || c === 48;
const GG = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
const GGL = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
const dataObj = d => new Date(d + "T12:00:00");

/* ---------- colori dei dati ---------- */
const SCALA_T = [[-40,"#821692"],[-30,"#8257DB"],[-20,"#208CEC"],[-10,"#20C4E8"],[0,"#23DDDD"],[10,"#C2FF28"],[20,"#FFF028"],[25,"#FFC228"],[30,"#FC8014"],[35,"#E8361E"],[40,"#9E0B26"]];
function hex2rgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function coloreT(t) {
  if (!num(t)) return "#C9D0D6";
  if (t <= SCALA_T[0][0]) return SCALA_T[0][1];
  for (let i = 1; i < SCALA_T.length; i++) {
    if (t <= SCALA_T[i][0]) {
      const [t0, c0] = SCALA_T[i - 1], [t1, c1] = SCALA_T[i], k = (t - t0) / (t1 - t0);
      const a = hex2rgb(c0), b = hex2rgb(c1);
      return "rgb(" + a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(",") + ")";
    }
  }
  return SCALA_T[SCALA_T.length - 1][1];
}
const UV = [[3, "#3EA72D", "Basso"], [6, "#FFF300", "Moderato"], [8, "#F18B00", "Alto"], [11, "#E53210", "Molto alto"], [99, "#B567A4", "Estremo"]];
const uvCat = v => UV.find(x => v < x[0]) || UV[4];
const AQI = [[20, "#50F0E6", "Buona"], [40, "#50CCAA", "Discreta"], [60, "#F0E641", "Moderata"], [80, "#FF5050", "Scadente"], [100, "#960032", "Molto scadente"], [1e9, "#7D2181", "Pessima"]];
const aqiCat = v => AQI.find(x => v <= x[0]) || AQI[5];
const DIR = ["Nord", "Nord-Est", "Est", "Sud-Est", "Sud", "Sud-Ovest", "Ovest", "Nord-Ovest"];
function ventoParola(k) { return k < 2 ? "Calmo" : k < 12 ? "Debole" : k < 29 ? "Moderato" : k < 50 ? "Forte" : k < 75 ? "Molto forte" : "Tempesta"; }

/* ---------- icone (SVG in linea) ---------- */
const GIALLO = "#FFB400";
function sole(cx, cy, r) {
  let raggi = "";
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
    raggi += `<line x1="${(cx + c * (r + 4)).toFixed(1)}" y1="${(cy + s * (r + 4)).toFixed(1)}" x2="${(cx + c * (r + 9)).toFixed(1)}" y2="${(cy + s * (r + 9)).toFixed(1)}"/>`;
  }
  return `<g stroke="${GIALLO}" stroke-width="3.2" stroke-linecap="round">${raggi}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${GIALLO}"/>`;
}
const lunaG = () => `<circle cx="30" cy="32" r="17" fill="#7F8FBF" mask="url(#mLunaG)"/>`;
const lunaP = () => `<circle cx="21" cy="21" r="11" fill="#7F8FBF" mask="url(#mLunaP)"/>`;
const nuvola = (x, y, s, c) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="20" cy="26" r="10"/><circle cx="33" cy="20" r="13"/><circle cx="45" cy="28" r="9"/><rect x="10" y="26" width="44" height="11" rx="5.5"/></g>`;
const gocce = (n, lunga) => {
  const xs = n === 2 ? [26, 38] : n === 3 ? [21, 32, 43] : [18, 27, 36, 45];
  return `<g stroke="#1E7BE0" stroke-width="3.4" stroke-linecap="round">` + xs.map(x => `<line x1="${x}" y1="45" x2="${x - 3}" y2="${lunga ? 57 : 52}"/>`).join("") + `</g>`;
};
const fiocchi = () => `<g fill="#3A93DB">` + [[20, 48], [32, 52], [44, 48], [26, 58], [38, 58]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.8"/>`).join("") + `</g>`;
const fulmine = () => `<polygon points="33,38 24,52 31,52 27,63 41,47 34,47 38,38" fill="${GIALLO}" stroke="#E39A00" stroke-width="1" stroke-linejoin="round"/>`;
function icona(c, giorno, cls) {
  let b;
  const g = giorno !== 0;
  if (c === 0) b = g ? sole(32, 32, 13) : lunaG();
  else if (c === 1) b = (g ? sole(27, 27, 12) : lunaG()) + nuvola(24, 30, .62, "#C3CDD7");
  else if (c === 2) b = (g ? sole(22, 22, 9) : lunaP()) + nuvola(5, 15, .92, "#C3CDD7");
  else if (c === 3) b = nuvola(8, 4, .8, "#AEB9C4") + nuvola(0, 13, 1, "#C9D2DB");
  else if (isNebbia(c)) b = nuvola(0, 0, 1, "#C9D2DB") + `<g stroke="#9AA5B1" stroke-width="4" stroke-linecap="round"><line x1="12" y1="45" x2="52" y2="45"/><line x1="18" y1="53" x2="46" y2="53"/></g>`;
  else if (isTemporale(c)) b = nuvola(0, 0, 1, "#7E8B99") + fulmine() + `<g stroke="#1E7BE0" stroke-width="3.4" stroke-linecap="round"><line x1="18" y1="45" x2="15" y2="53"/><line x1="48" y1="45" x2="45" y2="53"/></g>`;
  else if (isNeve(c)) b = nuvola(0, 0, 1, "#AEB9C4") + fiocchi();
  else if (c >= 51 && c <= 57) b = nuvola(0, 0, 1, "#AEB9C4") + gocce(3, false);
  else if (c === 65 || c === 67 || c === 82) b = nuvola(0, 0, 1, "#7E8B99") + gocce(4, true);
  else if (isPioggia(c)) b = nuvola(0, 0, 1, "#97A3B0") + gocce(3, true);
  else b = nuvola(0, 13, 1, "#C9D2DB");
  return `<svg viewBox="0 0 64 64" class="${cls || ""}" role="img" aria-label="${esc(cond(c))}">${b}</svg>`;
}

  goccia: `<svg viewBox="0 0 10 12" fill="currentColor"><path d="M5 0C3 3 1 5.3 1 7.5a4 4 0 0 0 8 0C9 5.3 7 3 5 0z"/></svg>`

const TONO = { info: ["#1E5FB0", "#E3EEFB"], ok: ["#1F7A3A", "#E4F4E8"], warn: ["#A26A00", "#FFF1CC"], bad: ["#A8231A", "#FDE5E2"], grey: ["#4B5763", "#EDF0F2"] };

/* ---------- avvio ---------- */
function mostraLuogo() {
  const l = LUOGHI.lista[attivo];
  $("luogoNome").textContent = l.nome + (l.sotto ? " · " + l.sotto : "");
  document.title = l.nome + " · MeteoAle (Chiaro)";
  const ch = $("chips");
  if (LUOGHI.lista.length > 1) {

    ch.innerHTML = LUOGHI.lista.map((x, i) => `<button class="chip" data-i="${i}" aria-pressed="${i === attivo}">${esc(x.nome)}</button>`).join("");
    ch.querySelectorAll(".chip").forEach(b => b.onclick = () => { attivo = +b.dataset.i; mostraLuogo(); carica(); });

  $("agg").textContent = "Non aggiornato";

async function prendi(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

let richiesta = 0;
async function carica() {
  const n = ++richiesta;
  const l = LUOGHI.lista[attivo];
  scheletro();
  const ll = `latitude=${l.lat.toFixed(4)}&longitude=${l.lon.toFixed(4)}&timezone=auto`;
  const uF = `https://api.open-meteo.com/v1/forecast?${ll}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,is_day,uv_index,relative_humidity_2m,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max,snowfall_sum,wind_gusts_10m_max&forecast_days=10`;
  const uA = `https://air-quality-api.open-meteo.com/v1/air-quality?${ll}&current=european_aqi,pm2_5,pm10&forecast_days=1`;
  const pA = prendi(uA, 12000).catch(() => null);
  let f;
  try {
    f = await prendi(uF, 15000);
    if (!f || !f.current || !f.hourly || !f.daily || !Array.isArray(f.hourly.time)) throw new Error("dati incompleti");
  } catch (e) {
    if (n !== richiesta) return;
    mostraErrore(navigator.onLine === false ? "Sembra che il telefono sia senza connessione. Riprova quando torna la rete." : "Il servizio meteo non risponde in questo momento. Riprova tra poco.");
    return;
  }
  const a = await pA;
  if (n !== richiesta) return;
  try { disegna(f, a); }
  catch (e) { console.error(e); mostraErrore("Qualcosa è andato storto nel mostrare i dati. Riprova."); }
}

/* ---------- logica dei consigli ---------- */
function analizza(f) {
  const H = f.hourly, D = f.daily, C = f.current;
  let i0 = H.time.indexOf(C.time.slice(0, 13) + ":00");
  if (i0 < 0) i0 = 0;
  const oggi = giornoDi(C.time);
  const nH = H.time.length;
  const fine = Math.min(i0 + 12, nH - 1);                 /* finestra dei consigli: prossime 12 ore */
  const fin = []; for (let i = i0; i <= fine; i++) fin.push(i);
  const v = (k, i) => H[k] ? H[k][i] : null;
  const dom = i => giornoDi(H.time[i]) !== oggi;
  const dalle = i => { const h = oraN(H.time[i]); return (dom(i) ? "domani " : "") + (h === 0 ? "da mezzanotte" : h === 1 ? "dall'1" : "dalle " + h); };
  const verso = i => { const h = oraN(H.time[i]); return (dom(i) ? "domani " : "") + "verso " + (h === 0 ? "mezzanotte" : h === 1 ? "l'1" : "le " + h); };
  const fino = i => { const h = oraN(H.time[i]); return dom(i) ? (h === 0 ? "fino a mezzanotte" : "fino a domani alle " + h) : (h === 1 ? "fino all'1" : "fino alle " + h); };
  const finTesto = fino(fine);

  /* ombrello */
  const prob = i => num(v("precipitation_probability", i)) ? v("precipitation_probability", i) : 0;
  const mm = i => num(v("precipitation", i)) ? v("precipitation", i) : 0;
  const bagnato = i => prob(i) >= 50 || (mm(i) >= 0.3 && prob(i) >= 30);
  const oraBagnata = fin.findIndex(bagnato);
  const adessoPiove = (num(C.precipitation) && C.precipitation > 0.05) || isPioggia(C.weather_code) || isNeve(C.weather_code);
  const pMax = Math.max(0, ...fin.map(prob));
  const mmTot = fin.reduce((s, i) => s + mm(i), 0);
  let omb;
  if (adessoPiove || oraBagnata >= 0) {
    const s = adessoPiove ? 0 : oraBagnata;
    let e = s; while (e + 1 < fin.length && bagnato(fin[e + 1])) e++;
    const iS = fin[s], iE = fin[e];
    const neve = isNeve(v("weather_code", iS)) || (adessoPiove && s === 0 && isNeve(C.weather_code));
    const tit = "Ombrello: sì, " + (neve ? "neve " : "") + (s === 0 ? "già adesso" : dalle(iS));
    const finoA = e === fin.length - 1 ? fino(iE) + " e oltre" : fino(Math.min(iE + 1, nH - 1));
    omb = { tono: "info", ico: "ombrello", tit, pill: ["Serve", "p-info"],
      sub: `${neve ? "Neve" : "Pioggia"} ${finoA} · probabilità fino al ${pMax}%${mmTot >= 0.5 ? " · " + dec(mmTot, 1) + " mm" : ""}`,
      why: "probabilità di pioggia almeno 50% in un'ora delle prossime 12" };
  } else if (pMax >= 30) {
    const iM = fin.find(i => prob(i) === pMax);
    omb = { tono: "warn", ico: "ombrello", tit: "Ombrello: forse", pill: ["Meglio averlo", "p-warn"],
      sub: `Qualche goccia possibile ${verso(iM)} (${pMax}%)`,
      why: "probabilità massima tra 30% e 49% nelle prossime 12 ore" };
  } else {
    omb = { tono: "ok", ico: "ombrello", tit: "Ombrello: no", pill: ["Non serve", "p-ok"],
      sub: `Asciutto ${finTesto} · probabilità massima ${pMax}%`,
      why: "probabilità di pioggia sotto il 30% nelle prossime 12 ore" };
  }

  /* vestiti: percepita minima nelle prossime 6 ore */
  const sei = fin.slice(0, 7);
  const perc = sei.map(i => v("apparent_temperature", i)).filter(num);
  if (num(C.apparent_temperature)) perc.push(C.apparent_temperature);
  const pMin = perc.length ? Math.min(...perc) : C.apparent_temperature;
  const pMaxT = perc.length ? Math.max(...perc) : C.apparent_temperature;
  const raff6 = Math.max(0, ...sei.map(i => v("wind_gusts_10m", i)).filter(num), num(C.wind_gusts_10m) ? C.wind_gusts_10m : 0);
  const uvOggi = H.time.map((t, i) => i).filter(i => giornoDi(H.time[i]) === oggi && num(v("uv_index", i)));
  const uvMax = num(D.uv_index_max[0]) ? D.uv_index_max[0] : Math.max(0, ...uvOggi.map(i => v("uv_index", i)));
  let capo, regola;
  if (!num(pMin)) { capo = "a strati"; regola = "dato non disponibile"; }
  else if (pMin < 5) { capo = "giacca pesante"; regola = "percepita sotto 5°"; }
  else if (pMin < 12) { capo = "giacca"; regola = "percepita tra 5° e 12°"; }
  else if (pMin < 18) { capo = "felpa"; regola = "percepita tra 12° e 18°"; }
  else { capo = "maniche corte"; regola = "percepita sopra 18°"; }
  const extra = [];
  if (omb.tono === "info") extra.push(isNeve(C.weather_code) || omb.tit.includes("neve") ? "scarpe da neve" : "impermeabile");
  else if (omb.tono === "warn") extra.push("k-way in borsa");
  if (num(pMin) && pMin < 0) extra.push("cappello e guanti");
  if (raff6 >= 40) extra.push("antivento");
  if (num(pMin) && num(pMaxT) && pMaxT - pMin >= 8) extra.push("vestiti a strati");
  if (uvMax >= 6 && num(pMaxT) && pMaxT >= 18) extra.push("occhiali da sole");
  const vest = { tono: "grey", ico: "giacca", tit: "Cosa mettere: " + capo,
    pill: num(pMin) ? ["Percepita " + gradi(pMin), "p-grey"] : null,
    sub: extra.length ? "Aggiungi: " + extra.join(", ") : "Nient'altro da aggiungere",
    why: `${regola} nelle prossime 6 ore${raff6 >= 40 ? ", raffiche " + Math.round(raff6) + " km/h" : ""}` };

  /* ore migliori per uscire (solo ore di luce) */
  const dIdx = d => D.time.indexOf(d);
  const luceDi = d => H.time.map((t, i) => i).filter(i => giornoDi(H.time[i]) === d && v("is_day", i) === 1);
  let cand = luceDi(oggi).filter(i => i >= i0), giornoUscita = "oggi";
  if (cand.length < 2 && D.time[1]) { cand = luceDi(D.time[1]); giornoUscita = "domani"; }
  const brutta = i => prob(i) >= 40 || mm(i) >= 0.2 || isTemporale(v("weather_code", i)) || isPioggia(v("weather_code", i)) && prob(i) >= 30 || isNeve(v("weather_code", i));
  const punti = i => {
    const t = v("apparent_temperature", i), u = v("uv_index", i) || 0, g = v("wind_gusts_10m", i) || 0, c = v("weather_code", i);
    return 100 - prob(i) * 0.5 - (num(t) ? Math.abs(t - 20) * 1.5 : 10) - (u >= 8 ? 12 : 0) - (g >= 50 ? 20 : g >= 35 ? 8 : 0) + (c <= 1 ? 6 : c === 2 ? 3 : isNebbia(c) ? -6 : 0);
  };
  let best = null;
  for (let a = 0; a < cand.length; a++) {
    let somma = 0;
    for (let b = a; b < cand.length && b < a + 4; b++) {
      if (cand[b] !== cand[a] + (b - a) || brutta(cand[b])) break;
      somma += punti(cand[b]);
      const len = b - a + 1;
      if (len >= 2) { const sc = somma / len + len * 1.5; if (!best || sc > best.sc) best = { a: cand[a], b: cand[b], sc }; }
    }
  }
  let usc;
  if (best) {
    const hA = oraN(H.time[best.a]), hB = oraN(H.time[best.b]) + 1;
    const pp = []; for (let i = best.a; i <= best.b; i++) pp.push(v("apparent_temperature", i));
    const pv = pp.filter(num), tMin = Math.min(...pv), tMax = Math.max(...pv);
    const cMid = v("weather_code", Math.round((best.a + best.b) / 2));
    const tTxt = pv.length ? (Math.round(tMin) === Math.round(tMax) ? gradi(tMin) : Math.round(tMin) + "–" + gradi(tMax)) : "";
    usc = { tono: "ok", ico: "orologio", tit: `Meglio uscire: ${giornoUscita === "domani" ? "domani " : ""}${hA}–${hB}`,
      pill: giornoUscita === "oggi" ? ["Oggi", "p-ok"] : ["Domani", "p-grey"],
      sub: `${cond(cMid)} · asciutto · percepita ${tTxt}${giornoUscita === "domani" ? " · oggi è già buio" : ""}`,
      why: "ore di luce senza pioggia, temperatura più vicina a 20°, poco vento e UV non estremo" };
  } else {
    usc = { tono: "warn", ico: "orologio", tit: giornoUscita === "oggi" ? "Uscire: oggi poche occasioni" : "Uscire: domani poche occasioni",
      pill: ["Al coperto", "p-warn"], sub: "Nessuna finestra asciutta di almeno 2 ore con la luce. Controlla il radar prima di uscire.",
      why: "tutte le ore di luce hanno pioggia, neve o temporale probabili" };
  }

  /* avvisi */
  const avvisi = [];
  /* ghiaccio: T ≤ 1° di notte o al mattino con precipitazione o umidità alta */
  const notteMattino = h => h >= 21 || h <= 10;
  const iceIdx = fin.find(i => {
    const t = v("temperature_2m", i), h = oraN(H.time[i]);
    if (!num(t) || t > 1 || !notteMattino(h)) return false;
    const umido = (v("relative_humidity_2m", i) || 0) >= 90;
    const precip = mm(i) > 0 || (i > 0 && mm(i - 1) > 0) || isNeve(v("weather_code", i));
    return umido || precip;
  });
  if (iceIdx !== undefined) {
    const h = oraN(H.time[iceIdx]), stesso = giornoDi(H.time[iceIdx]) === oggi;
    const quandoG = stesso ? (h <= 10 ? (oraN(C.time) < 5 ? "stanotte" : "stamattina") : "stasera") : (h <= 5 ? "stanotte" : "domattina");
    const tMinG = Math.min(...fin.map(i => v("temperature_2m", i)).filter(num));
    const motivo = mm(iceIdx) > 0 || isNeve(v("weather_code", iceIdx)) ? "precipitazioni" : "umidità " + Math.round(v("relative_humidity_2m", iceIdx) || 0) + "%";
    avvisi.push({ tono: "warn", ico: "strada", tit: "Strade: possibile ghiaccio " + quandoG, pill: ["Attenzione", "p-warn"],
      sub: `Fino a ${gradi(tMinG)} ${verso(iceIdx)} con ${motivo}. Guida con prudenza.`,
      why: "temperatura ≤ 1° di notte o al mattino con precipitazioni o umidità ≥ 90%. È una stima" });
  }
  const neveOre = fin.filter(i => isNeve(v("weather_code", i)));
  const neveCm = num(D.snowfall_sum[0]) ? D.snowfall_sum[0] : 0;
  if (neveOre.length || neveCm >= 0.5) {
    avvisi.push({ tono: "info", ico: "neve", tit: neveOre.length ? "Neve: " + dalle(neveOre[0]) : "Neve oggi", pill: ["Neve", "p-info"],
      sub: neveCm >= 0.5 ? `Accumulo previsto oggi circa ${dec(neveCm, 1)} cm` : "Fiocchi possibili, accumulo scarso",
      why: "codici neve nel modello nelle prossime 12 ore o neve prevista oggi" });
  }
  const tempIdx = fin.find(i => isTemporale(v("weather_code", i)));
  if (tempIdx !== undefined || isTemporale(C.weather_code)) {
    avvisi.push({ tono: "bad", ico: "fulmine", tit: "Temporale: possibile " + (tempIdx === undefined || tempIdx === i0 ? "adesso" : dalle(tempIdx)), pill: ["Allerta temporale", "p-bad"],
      sub: "Evita alberi isolati e spazi aperti. Controlla il radar.", why: "codice temporale nel modello nelle prossime 12 ore" });
  }
  const raffMax = Math.max(0, ...fin.map(i => v("wind_gusts_10m", i)).filter(num), num(C.wind_gusts_10m) ? C.wind_gusts_10m : 0);
  if (raffMax >= 50) avvisi.push({ tono: "bad", ico: "vento", tit: "Vento: raffiche fino a " + Math.round(raffMax) + " km/h", pill: ["Allerta vento", "p-bad"],
    sub: "Attenzione a rami, ombrelli e oggetti sui balconi.", why: "raffiche ≥ 50 km/h nelle prossime 12 ore (stima, non allerta ufficiale)" });
  else if (raffMax >= 35) avvisi.push({ tono: "warn", ico: "vento", tit: "Vento: a tratti sostenuto", pill: ["Raffiche " + Math.round(raffMax) + " km/h", "p-warn"],
    sub: "L'ombrello potrebbe essere scomodo.", why: "raffiche tra 35 e 50 km/h nelle prossime 12 ore" });
  const percMaxOggi = Math.max(-99, ...H.time.map((t, i) => i).filter(i => giornoDi(H.time[i]) === oggi && i >= i0).map(i => v("apparent_temperature", i)).filter(num));
  if (percMaxOggi >= 32) avvisi.push({ tono: "bad", ico: "caldo", tit: "Caldo: percepita fino a " + gradi(percMaxOggi), pill: ["Caldo intenso", "p-bad"],
    sub: "Evita il sole nelle ore centrali, bevi spesso.", why: "temperatura percepita ≥ 32°" });
  const uvOre = uvOggi.filter(i => v("uv_index", i) >= 3 && i >= i0);
  if (uvOre.length) {
    const cat = uvCat(uvMax);
    avvisi.push({ tono: "warn", ico: "sole", tit: `Sole: crema solare ${oraN(H.time[uvOre[0]])}–${oraN(H.time[uvOre[uvOre.length - 1]]) + 1}`,
      pill: ["UV " + Math.round(uvMax) + " " + cat[2].toLowerCase(), "p-warn"], sub: "Cappello e occhiali se stai fuori a lungo.", why: "indice UV ≥ 3 (scala OMS)" });
  }
  const nebIdx = fin.find(i => isNebbia(v("weather_code", i)));
  if (nebIdx !== undefined) {
    let e = fin.indexOf(nebIdx); while (e + 1 < fin.length && isNebbia(v("weather_code", fin[e + 1]))) e++;
    avvisi.push({ tono: "grey", ico: "nebbia", tit: "Nebbia: " + (nebIdx === i0 ? "adesso" : dalle(nebIdx)), pill: ["Visibilità ridotta", "p-grey"],
      sub: fino(Math.min(fin[e] + 1, nH - 1)).replace("fino", "Fino") + ". Fari accesi in auto.", why: "codice nebbia nel modello" });
  }
  if (!avvisi.length) avvisi.push({ tono: "ok", ico: "ok", tit: "Nessun avviso", pill: ["Tutto tranquillo", "p-ok"],
    sub: `Niente ghiaccio, vento forte, temporali o nebbia ${finTesto}.`, why: "nessuna delle soglie di avviso superata" });

  return { H, D, C, i0, oggi, fine, finTesto, omb, vest, usc, avvisi, uvMax, raffMax };
}

/* ---------- disegno ---------- */
function rigaRisposta(r) {
  const [c, bg] = TONO[r.tono] || TONO.grey;
  return `<li class="risposta">
    <div class="r-ico" style="background:${bg}">${I[r.ico](c)}</div>
    <div>
      <div class="r-tit"><strong>${esc(r.tit)}</strong>${r.pill ? `<span class="pill ${r.pill[1]}">${esc(r.pill[0])}</span>` : ""}</div>
      <div class="r-sub">${esc(r.sub)}</div>
      <div class="r-why">${esc(r.why)}</div>
    </div>
  </li>`;
}

function tintaHero(c, giorno) {
  if (!giorno) return "linear-gradient(180deg,#E6E9F5 0%,#fff 75%)";
  if (c <= 1) return "linear-gradient(180deg,#E3F1FD 0%,#fff 75%)";
  if (c === 2) return "linear-gradient(180deg,#E9F1F8 0%,#fff 75%)";
  if (isTemporale(c)) return "linear-gradient(180deg,#E4E6EC 0%,#fff 75%)";
  if (isPioggia(c) || isNeve(c)) return "linear-gradient(180deg,#E3EBF4 0%,#fff 75%)";
  return "linear-gradient(180deg,#ECEFF2 0%,#fff 75%)";
}

function frase(A) {
  const D = A.D, pezzi = [];
  if (A.omb.tono === "info") pezzi.push(`<b>${A.omb.tit.replace("Ombrello: sì, ", "Pioggia ").replace("Pioggia neve", "Neve")}</b>.`);
  else if (A.omb.tono === "warn") pezzi.push(`<b>Qualche goccia possibile</b> nelle prossime ore.`);
  else pezzi.push(`<b>Asciutto ${esc(A.finTesto)}</b>.`);
  if (D.time[1]) {
    const c = D.weather_code[1], p = D.precipitation_probability_max[1];
    const pTxt = num(p) && p >= 30 ? ` (pioggia ${p}%)` : "";
    pezzi.push(`Domani ${esc(cond(c).toLowerCase())}${pTxt}, ${gradi(D.temperature_2m_min[1])} / ${gradi(D.temperature_2m_max[1])}.`);
  }
  return pezzi.join(" ").replace("Pioggia già adesso", "Piove già adesso");
}

const APRI = '<span class="t-apri" aria-hidden="true">›</span>'; /* freccina dei riquadri che aprono un dettaglio */
function disegna(f, aria) {
  const A = analizza(f);
  const { H, D, C, i0 } = A;
  const l = LUOGHI.lista[attivo];
  $("agg").textContent = "Aggiornato alle " + hm(C.time);

  /* ADESSO */
  const tMin = D.temperature_2m_min[0], tMax = D.temperature_2m_max[0];
  let pos = 50;
  if (num(tMin) && num(tMax) && num(C.temperature_2m) && tMax > tMin) pos = Math.max(0, Math.min(100, (C.temperature_2m - tMin) / (tMax - tMin) * 100));
  const hero = `<section class="card hero" style="background:${tintaHero(C.weather_code, C.is_day)}">
    <div class="badges"><span class="pill p-oggi">Adesso</span><span class="pill p-grey">${esc(GGL[dataObj(A.oggi).getDay()])} ${parseInt(A.oggi.slice(8), 10)}</span></div>
    <div class="hero-main">
      ${icona(C.weather_code, C.is_day, "hero-ico")}
      <div style="min-width:0">
        <div class="hero-t">${gradi(C.temperature_2m)}</div>
        <div class="hero-cond">${esc(cond(C.weather_code))}</div>
        <div class="hero-feel">Percepita <b>${gradi(C.apparent_temperature)}</b></div>
      </div>
    </div>
    <div class="termo" style="background:linear-gradient(90deg,${coloreT(tMin)},${coloreT(tMax)})" title="Oggi da ${gradi(tMin)} a ${gradi(tMax)}"><i style="left:${pos.toFixed(1)}%;background:${coloreT(C.temperature_2m)}"></i></div>
    <div class="hero-facts">
      <div class="fact"><b>${gradi(tMax)}</b><span>Massima</span></div>
      <div class="fact"><b>${gradi(tMin)}</b><span>Minima</span></div>
      <div class="fact"><b>${num(C.relative_humidity_2m) ? Math.round(C.relative_humidity_2m) + "%" : "–"}</b><span>Umidità</span></div>
    </div>
    <p class="sintesi">${frase(A)}</p>
  </section>`;

  /* RISPOSTE */
  const nAvv = A.avvisi.filter(x => x.tono === "bad" || x.tono === "warn").length;
  const risp = `<section class="card">
    <div class="h-row"><h2>In breve</h2>${nAvv ? `<span class="pill p-warn">${nAvv} ${nAvv === 1 ? "avviso" : "avvisi"}</span>` : `<span class="pill p-ok">Nessun avviso</span>`}</div>
    <p class="sotto-h">Le risposte pratiche da adesso ${esc(A.finTesto)}</p>
    <ul class="risposte">${[A.omb, A.vest, A.usc].concat(A.avvisi).map(rigaRisposta).join("")}</ul>
    <div class="cta">
      <a class="btn btn-pri" href="../index.html#radar">${I.radar} Apri il radar</a>
      <a class="btn btn-sec" href="#dieci">${I.cal} Vedi i prossimi 10 giorni</a>
    </div>
  </section>`;

  /* 24 ORE */
  const fine24 = Math.min(i0 + 24, H.time.length - 1);
  const eventi = [];
  D.time.forEach((d, k) => {
    [["sunrise", "Alba"], ["sunset", "Tramonto"]].forEach(([key, nome]) => {
      const s = D[key] && D[key][k];
      if (s && s > C.time && s < H.time[fine24]) eventi.push({ s, nome, alba: key === "sunrise" });
    });
  });
  let ore = "";
  for (let i = i0; i <= fine24; i++) {
    const t = H.time[i], p = H.precipitation_probability[i];
    const giornoNuovo = i > i0 && oraN(t) === 0;
    const tv = i === i0 ? C.temperature_2m : H.temperature_2m[i];
    const cv = i === i0 ? C.weather_code : H.weather_code[i];
    const dv = i === i0 ? C.is_day : H.is_day[i];
    ore += `<div class="ora${i === i0 ? " adesso" : ""}">
      <div class="o-dd">${giornoNuovo ? esc(GG[dataObj(giornoDi(t)).getDay()]) : i === i0 ? "" : ""}</div>
      <div class="o-h">${i === i0 ? "Ora" : oraN(t)}</div>
      ${icona(cv, dv)}
      <div class="o-t">${gradi(tv)}</div>
      <div class="o-tc" style="background:${coloreT(tv)}"></div>
      <div class="o-p${num(p) && p >= 10 ? "" : " zero"}">${num(p) ? (p >= 10 ? I.goccia : "") + p + "%" : "–"}</div>
    </div>`;
    eventi.filter(e => e.s.slice(0, 13) === t.slice(0, 13)).forEach(e => {
      ore += `<div class="ora sole-ev">
        <div class="o-dd"></div><div class="o-h">${hm(e.s)}</div>
        <svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="#9AA5B1" stroke-width="3" stroke-linecap="round"><line x1="8" y1="44" x2="56" y2="44"/></g>${sole(32, 44, 10)}<rect x="0" y="45.5" width="64" height="20" fill="#fff"/><path d="M32 ${e.alba ? "62 V52 M26 56 L32 50 L38 56" : "50 V62 M26 57 L32 63 L38 57"}" stroke="#5A6570" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="o-t">${e.nome}</div>
      </div>`;
    });
  }
  const ventiquattro = `<section class="card">
    <div class="h-row"><h2>Prossime 24 ore</h2><span class="pill p-grey">Scorri →</span></div>
    <p class="sotto-h">Temperatura e probabilità di pioggia ora per ora</p>
    <div class="ore">${ore}</div>
    <div class="legenda"><span><i style="background:var(--rain);border-radius:50%"></i>Probabilità di pioggia</span><span><i style="background:linear-gradient(90deg,#23DDDD,#C2FF28,#FFF028,#FC8014)"></i>Freddo → caldo</span></div>
  </section>`;

  /* 10 GIORNI */
  const mins = D.temperature_2m_min.filter(num), maxs = D.temperature_2m_max.filter(num);
  const gMin = Math.min(...mins), gMax = Math.max(...maxs), rng = Math.max(1, gMax - gMin);
  const righe = D.time.map((d, k) => {
    const mn = D.temperature_2m_min[k], mx = D.temperature_2m_max[k], p = D.precipitation_probability_max[k];
    const dt = dataObj(d);
    const nome = k === 0 ? "Oggi" : k === 1 ? "Domani" : GG[dt.getDay()];
    const sub = k <= 1 ? GG[dt.getDay()] + " " + dt.getDate() : String(dt.getDate());
    const L = num(mn) ? (mn - gMin) / rng * 100 : 0, R = num(mx) ? (mx - gMin) / rng * 100 : 100;
    const dot = k === 0 && num(C.temperature_2m) ? `<i style="left:${Math.max(0, Math.min(100, (C.temperature_2m - gMin) / rng * 100)).toFixed(1)}%"></i>` : "";
    const neve = num(D.snowfall_sum[k]) && D.snowfall_sum[k] >= 0.5 ? `Neve ${dec(D.snowfall_sum[k], 1)} cm` : "";
    const vento = num(D.wind_gusts_10m_max[k]) && D.wind_gusts_10m_max[k] >= 50 ? `Raffiche ${Math.round(D.wind_gusts_10m_max[k])} km/h` : "";
    const note = [neve, vento].filter(Boolean).join(" · ");
    /* tocco sulla riga: pop-up del giorno, con la data così come arriva dall'API */
    return `<li><button type="button" class="giorno" data-giorno="${esc(d)}" aria-label="${esc(nome + " " + sub)}: ${esc(cond(D.weather_code[k]))}, minima ${gradi(mn)}, massima ${gradi(mx)}. Apri il dettaglio">
      <span class="g-d">${nome}<small>${sub}</small></span>
      ${icona(D.weather_code[k], 1, "gi")}
      <span class="g-p${num(p) && p >= 10 ? "" : " zero"}">${num(p) ? p + "%" : "–"}</span>
      <span class="g-min">${gradi(mn)}</span>
      <span class="g-bar" title="${esc(cond(D.weather_code[k]))}"><b style="left:${L.toFixed(1)}%;right:${(100 - R).toFixed(1)}%;background:linear-gradient(90deg,${coloreT(mn)},${coloreT(mx)})"></b>${dot}</span>
      <span class="g-max">${gradi(mx)}</span>
      <span class="g-apri" aria-hidden="true">›</span>
      ${note ? `<span class="g-note">${esc(note)}</span>` : ""}
    </button></li>`;
  }).join("");
  const dieci = `<section class="card" id="dieci">
    <div class="h-row"><h2>Prossimi 10 giorni</h2></div>
    <p class="sotto-h">Probabilità di pioggia · minima e massima · tocca un giorno per le ore</p>
    <ul class="giorni">${righe}</ul>
  </section>`;

  /* ARIA, UV, VENTO, SOLE */
  let tAria;
  const ac = aria && aria.current;
  if (ac && num(ac.european_aqi)) {
    const cat = aqiCat(ac.european_aqi), x = Math.min(100, ac.european_aqi / 120 * 100);
    tAria = `<a class="tile" href="../index.html#aria"><div class="t-l">Qualità dell'aria${APRI}</div>
      <div class="t-v">${Math.round(ac.european_aqi)}<small> /100+</small></div>
      <div class="cpill"><i style="background:${cat[1]}"></i>${cat[2]}</div>
      <div class="scala">${AQI.map(a => `<span style="background:${a[1]}"></span>`).join("")}<i style="left:${x.toFixed(1)}%"></i></div>
      <div class="t-s">PM2,5 ${dec(ac.pm2_5, 0)} · PM10 ${dec(ac.pm10, 0)} µg/m³</div></a>`;
  } else {
    tAria = `<a class="tile" href="../index.html#aria"><div class="t-l">Qualità dell'aria${APRI}</div><div class="t-v" style="font-size:20px;color:var(--muted)">–</div><div class="t-s">Dato non disponibile ora. Il resto del meteo è aggiornato.</div></a>`;
  }
  const uvNow = num(H.uv_index[i0]) ? H.uv_index[i0] : 0;
  const uvM = A.uvMax, uc = uvCat(uvM);
  const tUv = `<a class="tile" href="../index.html#uv"><div class="t-l">Indice UV oggi${APRI}</div>
    <div class="t-v">${num(uvM) ? Math.round(uvM) : "–"}<small> max</small></div>
    <div class="cpill"><i style="background:${uc[1]}"></i>${uc[2]}</div>
    <div class="scala">${UV.map(u => `<span style="background:${u[1]}"></span>`).join("")}<i style="left:${Math.min(100, uvM / 12 * 100).toFixed(1)}%"></i></div>
    <div class="t-s">Adesso ${Math.round(uvNow)} · ${uvM >= 3 ? "serve protezione" : "nessuna protezione"}</div></a>`;
  const dir = num(C.wind_direction_10m) ? C.wind_direction_10m : 0;
  const tVento = `<a class="tile" href="../index.html#vento"><div class="t-l">Vento${APRI}</div>
    <div class="vento-row">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#D8DDE2" stroke-width="2"/><text x="20" y="9" font-size="7" text-anchor="middle" fill="#5A6570" font-weight="700">N</text><g transform="rotate(${(dir + 180) % 360} 20 20)"><path d="M20 8 L26 26 L20 22 L14 26 Z" fill="#0F1720"/></g></svg>
      <div class="t-v" style="margin:0">${num(C.wind_speed_10m) ? Math.round(C.wind_speed_10m) : "–"}<small> km/h</small></div>
    </div>
    <div class="cpill" style="font-size:13.5px">${esc(ventoParola(C.wind_speed_10m || 0))}${(C.wind_speed_10m || 0) >= 2 ? " da " + esc(DIR[Math.round(dir / 45) % 8]) : ""}</div>
    <div class="t-s">Raffiche ${num(C.wind_gusts_10m) ? Math.round(C.wind_gusts_10m) : "–"} km/h · max oggi ${num(D.wind_gusts_10m_max[0]) ? Math.round(D.wind_gusts_10m_max[0]) : "–"}</div></a>`;
  const sr = D.sunrise[0], ss = D.sunset[0];
  let tSole = `<a class="tile" href="../index.html#sole"><div class="t-l">Sole${APRI}</div><div class="t-s">Orari non disponibili</div></a>`;
  if (sr && ss) {
    const m = s => parseInt(s.slice(11, 13), 10) * 60 + parseInt(s.slice(14, 16), 10);
    const durata = m(ss) - m(sr), adesso = m(C.time);
    const k = Math.max(0, Math.min(1, (adesso - m(sr)) / Math.max(1, durata)));
    const ang = Math.PI * (1 - k), cx = 50 + 40 * Math.cos(ang), cy = 42 - 34 * Math.sin(ang);
    const su = adesso > m(sr) && adesso < m(ss);
    tSole = `<a class="tile" href="../index.html#sole"><div class="t-l">Sole${APRI}</div>
      <svg class="arco" viewBox="0 0 100 46" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path d="M10 42 A40 34 0 0 1 90 42" fill="none" stroke="#D8DDE2" stroke-width="2" stroke-dasharray="3 3"/>
        <line x1="4" y1="42" x2="96" y2="42" stroke="#C3CBD2" stroke-width="1.5"/>
        ${su ? `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="${GIALLO}"/>` : `<circle cx="${adesso < m(sr) ? 10 : 90}" cy="42" r="5" fill="#7F8FBF"/>`}
      </svg>
      <div class="sole-orari"><span><small>Alba</small>${hm(sr)}</span><span style="text-align:right"><small>Tramonto</small>${hm(ss)}</span></div>
      <div class="t-s">${Math.floor(durata / 60)} h ${durata % 60} min di luce</div></a>`;
  }
  const dettagli = `<section class="card">
    <h2>Aria, sole e vento</h2>
    <p class="sotto-h">Valori di adesso e di oggi · tocca per i dettagli</p>
    <div class="grid2">${tAria}${tUv}${tVento}${tSole}</div>
  </section>`;

  /* RADAR */
  /* tutto il riquadro apre il radar (il pulsante dentro è solo l'aspetto: niente link nel link) */
  const radar = `<a class="card" href="../index.html#radar">
    <div class="radar">
      <div>
        <h2>Radar della pioggia</h2>
        <p class="sotto-h" style="margin-bottom:10px">Dove piove adesso e nelle prossime ore, sulla mappa.</p>
        <span class="btn btn-pri">${I.radar} Apri il radar</span>
      </div>
      <svg class="mini" viewBox="0 0 86 86" aria-hidden="true">
        <rect width="86" height="86" fill="#EEF2F0"/>
        <path d="M0 60 C20 50 30 70 50 58 S80 40 86 46 V86 H0Z" fill="#E2E8E4"/>
        <path d="M10 0 C20 30 40 40 60 86" stroke="#fff" stroke-width="3" fill="none"/>
        <ellipse cx="50" cy="34" rx="26" ry="16" fill="#66FCFC" opacity=".75"/>
        <ellipse cx="54" cy="34" rx="16" ry="10" fill="#4CFB4C" opacity=".85"/>
        <ellipse cx="57" cy="34" rx="7" ry="5" fill="#FBFB4C"/>
        <circle cx="34" cy="52" r="4" fill="#0A6B73" stroke="#fff" stroke-width="2"/>
      </svg>
    </div>
  </a>`;

  /* REGOLE */
  const regole = `<section class="card"><details class="regole">
    <summary>Come decidiamo i consigli</summary>
    <ul>
      <li><b>Ombrello:</b> sì se in un'ora delle prossime 12 la probabilità di pioggia è almeno 50%; forse tra 30% e 49%; no sotto il 30%.</li>
      <li><b>Cosa mettere:</b> dalla temperatura percepita più bassa delle prossime 6 ore. Sotto 5° giacca pesante, 5–12° giacca, 12–18° felpa, sopra 18° maniche corte. Si aggiunge impermeabile se piove, antivento con raffiche da 40 km/h, cappello e guanti sotto 0°.</li>
      <li><b>Ore migliori:</b> almeno 2 ore di luce di fila senza pioggia (probabilità sotto 40%), con temperatura percepita più vicina a 20°, poco vento e UV non estremo.</li>
      <li><b>Ghiaccio:</b> "possibile" se di notte o al mattino la temperatura scende a 1° o meno con precipitazioni o umidità dal 90%.</li>
      <li><b>Vento:</b> avviso da raffiche di 35 km/h, allerta da 50 km/h. <b>Crema solare:</b> indice UV da 3.</li>
      <li>Sono stime dal modello Open-Meteo, non allerte ufficiali della Protezione Civile.</li>
    </ul>
  </details></section>`;

  $("main").innerHTML = hero + risp + ventiquattro + dieci + dettagli + radar + regole;
}

/* un solo ascoltatore (il contenuto si ridisegna a ogni aggiornamento): giorno toccato → pop-up del giorno.
   La località si legge al tocco: i bottoni in alto possono averla cambiata. */
$("main").addEventListener("click", e => {
  const b = e.target.closest("[data-giorno]");
  if (!b || !window.MeteoGiorno) return;
  const l = LUOGHI.lista[attivo];
  MeteoGiorno.apri({ lat: l.lat, lon: l.lon, nome: l.nome, data: b.dataset.giorno });
});

mostraLuogo();
carica();
</script>
