<!doctype html>
<html lang="it" data-stile="scena">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6DB8F5">
<title>MeteoAle · Scena</title>
<style>
:root {
  --bg: #EAF4FD; --card: #FFFFFF; --testo: #15263A; --tenue: #5F7085; --linea: #E3EAF2; --traccia: #E6ECF2;
  --blu: #2F7FE0; --ink: #FFFFFF; --ombra: 0 1px 2px rgba(20,40,70,.06), 0 6px 20px rgba(20,40,70,.07);
  /* colori della scena (impostati da JS) */
  --s1: #2F8FE8; --s2: #6DB8F5; --s3: #CDEBFF; --roccia: #B9AFA6; --roccia2: #8E847C; --cima: #FFFFFF;
  --colle: #5E9C5A; --pino: #2F6B3D; --prato: #86C06A; --prato2: #74AE5B; --nube: #FFFFFF; --nube2: #DDE7F0;
  --finestra: #3E5266; --nebbia: rgba(255,255,255,.75);
}
body.scuro { --bg: #0E1630; --card: #18223F; --testo: #EAF0FF; --tenue: #9AA8C8; --linea: #26324F; --traccia: #2A3658; --blu: #6FB2FF; --ombra: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--testo);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  transition: background-color .6s;
  overflow-x: hidden;
}
.pagina { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

/* ---------- scena ---------- */
.scena { position: relative; height: 380px; height: clamp(330px, 47svh, 430px); overflow: hidden; background: var(--s2); }
.scena svg.paesaggio { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; }
.scena .lampo-flash { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #fff; opacity: 0; pointer-events: none; }
.precip { position: absolute; top: -10%; right: -15%; bottom: 0; left: -15%; pointer-events: none; }
.precip.pioggia { transform: rotate(12deg); }
.precip span { position: absolute; top: -8%; display: block; will-change: transform; }
.precip.pioggia span { width: 2px; height: 18px; border-radius: 2px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(225,238,255,.85)); animation: cade linear infinite; }
.precip.pioviggine span { height: 9px; width: 1.3px; opacity: .8; }
.precip.neve span { border-radius: 50%; background: #fff; box-shadow: 0 0 1px 1px rgba(90,110,140,.22); animation: fiocco linear infinite; }
@keyframes cade { from { transform: translate3d(0,0,0); } to { transform: translate3d(0, var(--h), 0); } }
@keyframes fiocco {
  0% { transform: translate3d(0,0,0); }
  25% { transform: translate3d(9px, calc(var(--h) * .25), 0); }
  50% { transform: translate3d(-5px, calc(var(--h) * .5), 0); }
  75% { transform: translate3d(8px, calc(var(--h) * .75), 0); }
  100% { transform: translate3d(0, var(--h), 0); }
}
/* nuvole che attraversano il cielo (verso destra o verso sinistra, secondo il vento) */
.vola { animation: vola linear infinite; }
.vola.indietro { animation-name: vola-r; }
@keyframes vola { 0% { transform: translateX(0); opacity: 0; } 7% { opacity: 1; } 100% { transform: translateX(var(--L)); opacity: 1; } }
@keyframes vola-r { 0% { transform: translateX(var(--L)); opacity: 1; } 93% { opacity: 1; } 100% { transform: translateX(0); opacity: 0; } }
/* mucche */
.mucca .passo { animation: passo ease-in-out infinite; }
@keyframes passo { 0%, 30% { transform: translateX(0); } 48%, 78% { transform: translateX(5px); } 100% { transform: translateX(0); } }
.mucca .testa { animation: bruca ease-in-out infinite; }
@keyframes bruca {
  0%, 16% { transform: rotate(0); } 26% { transform: rotate(62deg); } 33% { transform: rotate(55deg); } 40% { transform: rotate(62deg); }
  47% { transform: rotate(56deg); } 54% { transform: rotate(62deg); } 64%, 100% { transform: rotate(0); }
}
.mucca .coda { animation: coda 3.4s ease-in-out infinite alternate; }
@keyframes coda { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
html.statico .mucca .testa.giu { transform: rotate(60deg); }
/* trattore: va, si gira, torna */
#trattore .tr-va { animation: tr-va 70s infinite; }
@keyframes tr-va {
  0% { transform: translateX(0); animation-timing-function: ease-in-out; } 44% { transform: translateX(132px); }
  50% { transform: translateX(132px); animation-timing-function: ease-in-out; } 94% { transform: translateX(0); } 100% { transform: translateX(0); }
}
#trattore .tr-gira { animation: tr-gira 70s linear infinite; }
@keyframes tr-gira { 0%, 45.5% { transform: scaleX(1); } 48.5%, 95.5% { transform: scaleX(-1); } 98.5%, 100% { transform: scaleX(1); } }
#trattore .ruota-g { animation: ruota-g 70s infinite; }
@keyframes ruota-g {
  0% { transform: rotate(0); animation-timing-function: ease-in-out; } 44% { transform: rotate(1260deg); }
  50% { transform: rotate(1260deg); animation-timing-function: ease-in-out; } 94%, 100% { transform: rotate(2520deg); }
}
#trattore .ruota-p { animation: ruota-p 70s infinite; }
@keyframes ruota-p {
  0% { transform: rotate(0); animation-timing-function: ease-in-out; } 44% { transform: rotate(2160deg); }
  50% { transform: rotate(2160deg); animation-timing-function: ease-in-out; } 94%, 100% { transform: rotate(4320deg); }
}
#trattore .sbuffo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: sbuffo 2.6s ease-out infinite; }
@keyframes sbuffo { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 15% { opacity: .7; } 100% { opacity: 0; transform: translate(-7px,-11px) scale(1.9); } }
#trattore.fermo .tr-va, #trattore.fermo .tr-gira, #trattore.fermo .ruota-g, #trattore.fermo .ruota-p { animation: none; }
#trattore.fermo .sbuffo, #trattore:not(.fari) .faro-luce { display: none; }
html.statico #trattore:not(.fermo) .tr-va { transform: translateX(62px); }
html.statico #trattore .sbuffo { display: none; }
.nebbia-banda { animation: nebbia 16s ease-in-out infinite alternate; }
@keyframes nebbia { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
.raggi { transform-box: fill-box; transform-origin: center; animation: gira 60s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.alone { transform-box: fill-box; transform-origin: center; animation: pulsa 5s ease-in-out infinite alternate; }
@keyframes pulsa { from { opacity: .55; transform: scale(.94); } to { opacity: .9; transform: scale(1.06); } }
.stella { animation: brilla ease-in-out infinite alternate; }
@keyframes brilla { from { opacity: .25; } to { opacity: 1; } }
.fumo { transform-box: fill-box; transform-origin: center; animation: fumo 6s ease-out infinite; opacity: 0; }
@keyframes fumo { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 20% { opacity: .55; } 100% { opacity: 0; transform: translate(14px,-34px) scale(1.8); } }
.fulmine { opacity: 0; animation: fulmine 7s linear infinite; }
.lampo-flash.attivo { animation: flash 7s linear infinite; }
@keyframes fulmine { 0%, 88% { opacity: 0; } 89% { opacity: 1; } 90% { opacity: .2; } 91.5% { opacity: 1; } 94%, 100% { opacity: 0; } }
@keyframes flash { 0%, 88% { opacity: 0; } 89% { opacity: .45; } 90% { opacity: .05; } 91.5% { opacity: .3; } 94%, 100% { opacity: 0; } }

/* immagine ferma: movimento ridotto, ?statico=1 o animazioni spente nelle impostazioni (html.mi-no-anim) */
html.statico .scena *, html.statico .scena *::before,
html.mi-no-anim .scena *, html.mi-no-anim .scena *::before { animation: none !important; transition: none !important; }
html.statico .fulmine, html.mi-no-anim .fulmine { opacity: 1; }
html.statico .fumo, html.mi-no-anim .fumo { opacity: .4; }
@media (prefers-reduced-motion: reduce) {
  .scena *, .scena *::before { animation: none !important; transition: none !important; }
  .fulmine { opacity: 1; }
  .fumo { opacity: .4; }
}
/* pagina nascosta: tutto in pausa */
html.pausa .scena *, html.pausa .scena *::before { animation-play-state: paused !important; }

/* testi sopra la scena */
.sopra { position: absolute; top: 0; right: 0; bottom: 0; left: 0; color: var(--ink); pointer-events: none; padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 0; }
.sopra.chiaro-ombra { text-shadow: 0 1px 2px rgba(0,0,0,.18), 0 2px 18px rgba(10,30,60,.30); }
.riga-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-right: 44px; /* spazio per la rotella delle impostazioni */ }
.saluto { font-size: 16px; font-weight: 600; opacity: .95; line-height: 1.2; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.luogo { font-size: 23px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; line-height: 1.15; }
.luogo svg { flex: none; width: 17px; height: 17px; }
.agg { font-size: 13px; font-weight: 500; opacity: .9; margin-top: 3px; }
.temp { font-size: 104px; font-weight: 250; line-height: .95; letter-spacing: -.04em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.temp sup { font-size: .5em; font-weight: 300; vertical-align: top; position: relative; top: .12em; margin-left: 2px; }
.cond { font-size: 21px; font-weight: 650; margin-top: 2px; max-width: 62%; line-height: 1.2; }
.pillola { display: flex; gap: 10px; flex-wrap: wrap; font-size: 15px; font-weight: 550; margin-top: 6px; }
.pillola b { font-weight: 750; }
.pillola .sep { opacity: .6; }
.sopra::before { content: ""; position: absolute; left: -20%; top: -10%; width: 105%; height: 85%; background: radial-gradient(closest-side, rgba(8,24,52,.2), rgba(8,24,52,0)); pointer-events: none; z-index: -1; }
.sopra { z-index: 0; }
.sopra.ink-scuro::before { background: radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,0)); }
.prova-badge { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translateX(-50%); display: none; }

/* ---------- contenuto ---------- */
.contenuto { position: relative; margin-top: -26px; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 18px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.contenuto > *, .tessere > * { min-width: 0; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--ombra); padding: 16px; transition: background-color .6s; }
.titolo { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
.titolo svg { width: 15px; height: 15px; }

.sintesi { display: flex; gap: 12px; align-items: center; }
.sintesi .ic { flex: none; width: 44px; height: 44px; }
.sintesi p { flex: 1; min-width: 0; margin: 0; font-size: 17px; line-height: 1.35; font-weight: 560; }
.condividi { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--traccia); color: var(--testo); display: grid; place-items: center; cursor: pointer; }
.condividi svg { width: 20px; height: 20px; }

.ore { display: flex; gap: 4px; overflow-x: auto; scroll-snap-type: x proximity; margin: 0 -16px; padding: 0 12px 4px; scrollbar-width: none; }
.ore::-webkit-scrollbar { display: none; }
.ora { flex: none; width: 58px; scroll-snap-align: start; text-align: center; padding: 8px 0 6px; border-radius: 16px; }
.ora.adesso { background: var(--traccia); }
.ora .h { font-size: 13.5px; font-weight: 600; color: var(--tenue); }
.ora.adesso .h { color: var(--testo); font-weight: 750; }
.ora svg { width: 32px; height: 32px; margin: 6px auto 4px; display: block; }
.ora .t { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ora .p { font-size: 12.5px; font-weight: 700; color: var(--blu); margin-top: 3px; min-height: 15px; }
.ora .p.zero { color: var(--tenue); opacity: .45; font-weight: 500; }
.ora .tbar { height: 4px; border-radius: 3px; margin: 6px 10px 0; }

.giorni { display: grid; }
.giorno { display: grid; grid-template-columns: 74px 30px 38px 32px 1fr 32px 10px; align-items: center; gap: 6px; padding: 9px 0; border-top: 1px solid var(--linea); font-variant-numeric: tabular-nums; }
/* ogni giorno è un pulsante: apre il pop-up con le ore (giorno.js) */
button.giorno { width: 100%; margin: 0; background: none; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity .15s; }
button.giorno:active { opacity: .55; }
.giorno > span { display: block; }
/* freccina "apri": giorni e tessere toccabili */
.apri { color: var(--tenue); font-size: 20px; line-height: 1; font-weight: 500; text-align: right; letter-spacing: 0; text-transform: none; }
.titolo .apri { margin-left: auto; font-size: 19px; margin-top: -2px; }
a.tessera { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s ease, background-color .6s; }
a.tessera:active { transform: scale(.98); }
.giorno:first-child { border-top: 0; padding-top: 2px; }
.giorno .g { font-size: 16px; font-weight: 650; text-transform: capitalize; }
.giorno .g small { display: block; font-size: 11.5px; color: var(--tenue); font-weight: 500; text-transform: none; }
.giorno svg { width: 30px; height: 30px; }
.giorno .p { font-size: 12.5px; font-weight: 700; color: var(--blu); text-align: left; }
.giorno .mn { text-align: right; color: var(--tenue); font-weight: 600; font-size: 16px; }
.giorno .mx { text-align: left; font-weight: 750; font-size: 16px; }
.barra { position: relative; height: 7px; border-radius: 6px; background: var(--traccia); }
.barra i { position: absolute; top: 0; bottom: 0; border-radius: 6px; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
.barra b { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 2px var(--testo); }

.tessere { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.tessera { min-height: 150px; display: flex; flex-direction: column; }
.tessera .titolo { margin-bottom: 8px; }
.tessera .val { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.tessera .val small { font-size: 15px; font-weight: 600; color: var(--tenue); letter-spacing: 0; }
.tessera .desc { font-size: 15px; font-weight: 650; margin-top: 6px; }
.tessera .nota { font-size: 12.5px; color: var(--tenue); margin-top: auto; padding-top: 8px; line-height: 1.35; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 99px; font-size: 14px; font-weight: 700; margin-top: 8px; align-self: flex-start; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .55; }
.uvscala { display: flex; gap: 3px; margin-top: 10px; position: relative; }
.uvscala span { flex: 1; height: 7px; border-radius: 4px; }
.uvscala b { position: absolute; top: -4px; width: 4px; height: 15px; margin-left: -2px; border-radius: 3px; background: var(--testo); box-shadow: 0 0 0 2px var(--card); }
.arcosole { width: 100%; height: 62px; display: block; margin-top: 2px; }
.orari { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.orari span { display: flex; flex-direction: column; }
.orari small { font-size: 11px; color: var(--tenue); font-weight: 600; }
.orari span:last-child { text-align: right; }
.bussola { display: flex; align-items: center; gap: 10px; }
.bussola svg { width: 46px; height: 46px; flex: none; }

.radar { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; padding: 12px; }
.radar .mini { flex: none; width: 92px; height: 70px; border-radius: 14px; overflow: hidden; }
.radar .mini svg { display: block; width: 100%; height: 100%; }
.radar .tx { flex: 1; }
.radar .tx b { font-size: 18px; display: block; }
.radar .tx span { font-size: 14px; color: var(--tenue); }
.radar .freccia { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--blu); color: #fff; display: grid; place-items: center; }

.piede { text-align: center; font-size: 12px; color: var(--tenue); line-height: 1.7; padding: 6px 10px 4px; }
.piede a { color: inherit; }
.piede .prop { display: inline-block; margin-top: 4px; font-weight: 700; letter-spacing: .04em; opacity: .8; }

/* caricamento ed errore */
.scheletro { position: relative; overflow: hidden; background: var(--traccia); border-radius: 12px; }
.scheletro::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: luccica 1.4s infinite; }
@keyframes luccica { to { transform: translateX(100%); } }
html.statico .scheletro::after { animation: none; }
html.statico body, html.statico .card { transition: none; }
.errore { text-align: center; padding: 22px 18px; }
.errore b { display: block; font-size: 18px; margin: 8px 0 4px; }
.errore p { margin: 0 0 14px; color: var(--tenue); font-size: 15px; }
.bottone { border: 0; border-radius: 14px; background: var(--blu); color: #fff; font-size: 16px; font-weight: 700; padding: 12px 22px; min-height: 44px; cursor: pointer; font-family: inherit; }
.avviso { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translate(-50%, 20px); background: #15263A; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; }
.avviso.su { opacity: 1; transform: translate(-50%, 0); }
.nascosto { display: none !important; }
@media (max-width: 370px) {
  .temp { font-size: 94px; }
  .giorno { grid-template-columns: 66px 28px 34px 30px 1fr 30px 10px; gap: 5px; }
  .tessera .val { font-size: 30px; }
  .pillola { gap: 10px; font-size: 13.5px; }
}
/* tablet (iPad, anche in orizzontale): la scena usa tutta la larghezza, niente colonna da telefono */
@media (min-width: 700px) {
  .pagina { max-width: none; }
}
</style>

<div class="pagina">

  <!-- ================= SCENA ================= -->

      <defs>
        <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--s1)"/>
          <stop offset=".55" style="stop-color:var(--s2)"/>
          <stop offset="1" style="stop-color:var(--s3)"/>
        </linearGradient>
        <radialGradient id="aloneSole">
          <stop offset="0" stop-color="#FFF6C8" stop-opacity=".95"/>
          <stop offset=".35" stop-color="#FFE07A" stop-opacity=".45"/>
          <stop offset="1" stop-color="#FFE07A" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="aloneLuna">
          <stop offset="0" stop-color="#E9EEFF" stop-opacity=".55"/>

        <radialGradient id="luceFinestra">
          <stop offset="0" stop-color="#FFD978" stop-opacity=".8"/>
          <stop offset="1" stop-color="#FFD978" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="nebbiaG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--nebbia)" stop-opacity="0"/>
          <stop offset=".5" style="stop-color:var(--nebbia)"/>
          <stop offset="1" style="stop-color:var(--nebbia)" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="discoLuna"><circle r="15"/></clipPath>
        <clipPath id="corpoMucca"><rect x="-10" y="-13" width="18.5" height="8.5" rx="4"/></clipPath>
        <filter id="buio" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".42 0 0 0 0  0 .45 0 0 0  0 0 .6 0 .02  0 0 0 1 0"/></filter>
        <linearGradient id="luceFaro" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#FFF3B0" stop-opacity=".85"/>
          <stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/>
        </linearGradient>
        <symbol id="nube" viewBox="0 0 120 60" overflow="visible">
          <path style="fill:var(--nube2)" d="M14 58 C2 58 -2 44 8 38 C6 26 20 18 31 24 C36 8 60 2 72 16 C84 8 102 14 102 30 C116 30 122 46 112 54 C110 57 106 58 102 58 Z"/>
          <path style="fill:var(--nube)" d="M16 52 C5 52 2 41 10 36 C9 26 21 20 31 25 C36 11 58 6 70 19 C81 11 98 17 98 31 C111 31 115 44 107 50 C105 51.5 103 52 100 52 Z"/>
        </symbol>
        <symbol id="pino" viewBox="-8 -26 16 28" overflow="visible">
          <path style="fill:var(--pino)" d="M0 -26 L5 -15 L3 -15 L7 -7 L4 -7 L8 1 L-8 1 L-4 -7 L-7 -7 L-3 -15 L-5 -15 Z"/>
        </symbol>
      </defs>

      <rect width="400" height="340" fill="url(#cielo)"/>
      <g id="stelle"></g>

      <g id="sole" transform="translate(300 70)">
        <circle class="alone" r="64" fill="url(#aloneSole)"/>

function sole(x, y, r) {
  let ra = "";
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, c = Math.cos(a), s = Math.sin(a); ra += `<line x1="${x + c * (r + 2.4)}" y1="${y + s * (r + 2.4)}" x2="${x + c * (r + 5)}" y2="${y + s * (r + 5)}"/>`; }
  return `<g stroke="#FFB92E" stroke-width="2" stroke-linecap="round">${ra}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#FFC531"/>`;
}
function luna(x, y, r) { return `<path fill="#F2C94C" d="M${x + r * .35} ${y - r} a${r} ${r} 0 1 0 ${r * .65} ${r * 1.55} a${r * .85} ${r * .85} 0 0 1 -${r * .65} -${r * 1.55}z"/>`; }
function gocce(n, col) {
  const xs = n === 2 ? [12, 19] : n === 3 ? [10, 16, 22] : [8.5, 13.5, 18.5, 23.5];
  return xs.map((x, i) => `<path fill="${col}" d="M${x} ${24 + (i % 2) * 2}l-1.6 3.4a1.8 1.8 0 1 0 3.2 0z"/>`).join("");
}
function fiocchi(n) {
  const xs = n === 2 ? [12, 20] : [9.5, 16, 22.5];
  return xs.map((x, i) => { const y = 26.5 + (i % 2) * 1.5; return `<g stroke="#5DB3EA" stroke-width="1.4" stroke-linecap="round"><line x1="${x - 2.2}" y1="${y}" x2="${x + 2.2}" y2="${y}"/><line x1="${x - 1.1}" y1="${y - 1.9}" x2="${x + 1.1}" y2="${y + 1.9}"/><line x1="${x - 1.1}" y1="${y + 1.9}" x2="${x + 1.1}" y2="${y - 1.9}"/></g>`; }).join("");
}
function icona(c, giorno) {
  let s = "";
  const astro = (x, y, r) => giorno ? sole(x, y, r) : luna(x, y, r);
  if (c === 0) s = giorno ? sole(16, 16, 7.5) : luna(14, 15, 9);
  else if (c === 1) s = astro(13, 12, 6.5) + nuvola(9, 12, .62, "#E3E9F0", CL);
  else if (c === 2) s = astro(12, 11, 6.5) + nuvola(3, 7, .9, "#E3E9F0", CL);
  else if (c === 3) s = nuvola(-2, 0, .75, CL, CL2) + nuvola(3, 5, .95, "#E3E9F0", CL);
  else if (c === 45 || c === 48) s = nuvola(1, 0, .95, CL, CL2) + `<g stroke="#9AA6B2" stroke-width="2" stroke-linecap="round"><line x1="5" y1="24" x2="25" y2="24"/><line x1="9" y1="28.5" x2="28" y2="28.5"/></g>`;
  else if (eTemporale(c)) s = nuvola(1, -2, .95, CLD, CLD2) + `<path fill="#FFC21A" d="M16.5 17.5l-4.5 7h3.6l-2 6 6-8.2h-3.7l2.2-4.8z"/>` + (c > 95 ? `<circle cx="9" cy="27" r="1.6" fill="#B9DDF5"/><circle cx="23" cy="26" r="1.6" fill="#B9DDF5"/>` : "");
  else if (eNeve(c)) s = nuvola(1, -3, .95, CL, CL2) + fiocchi(c === 71 || c === 77 ? 2 : 3);
  else if (c >= 51 && c <= 57) s = nuvola(1, -3, .95, CL, CL2) + gocce(2, "#5AA7F0");
  else if (c >= 80) s = astro(9, 8, 5.5) + nuvola(2, -2, .95, CL, CL2) + gocce(c === 80 ? 2 : 3, "#3B8BEA");
  else if (ePioggia(c)) s = nuvola(1, -3, .95, c === 65 || c === 67 ? CLD : CL, c === 65 || c === 67 ? CLD2 : CL2) + gocce(c === 61 ? 2 : c === 65 ? 4 : 3, "#3B8BEA");
  else s = nuvola(3, 5, .95, "#E3E9F0", CL);
  return `<svg viewBox="0 0 32 32" aria-hidden="true">${s}</svg>`;
}

const NEVE_SUOLO = { colle: "#E1E8EF", prato: "#F4F7FA", prato2: "#E3EAF1" };
const NEVE_SUOLO_NOTTE = { colle: "#5D6A86", prato: "#7D8AA6", prato2: "#6B7895" };

/* ---------- costruzione della scena ---------- */
const scena = $("scena");
function el(tag, attrs, padre) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (padre) padre.appendChild(e); return e; }
let rnd = (function (s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; })(7);

(function bosco() {
  const g = $("bosco");
  const pos = [[8, 244, 13], [20, 240, 15], [34, 238, 12], [62, 236, 14], [74, 238, 11], [104, 240, 13], [150, 246, 12], [164, 242, 15], [178, 238, 13], [268, 234, 12], [282, 236, 15], [296, 238, 12], [360, 240, 14], [374, 238, 12], [388, 236, 15]];
  pos.forEach(([x, y, h]) => el("use", { href: "#pino", x: x - h * .3, y: y - h + 2, width: h * .6, height: h }, g));
})();
(function stelle() {
  const g = $("stelle");
  for (let i = 0; i < 38; i++) {
    const c = el("circle", { cx: (rnd() * 400).toFixed(1), cy: (rnd() * 190).toFixed(1), r: (rnd() * 1.1 + .4).toFixed(2), fill: "#fff" }, g);
    if (i % 3 === 0) { c.setAttribute("class", "stella"); c.style.animationDuration = (2 + rnd() * 3).toFixed(1) + "s"; c.style.animationDelay = (-rnd() * 4).toFixed(1) + "s"; }
    else c.setAttribute("opacity", (.4 + rnd() * .5).toFixed(2));
  }
})();

function nubi(n, scuro, vento, dirVento) {
  const lont = $("nubiLontane"), vic = $("nubiVicine");
  lont.innerHTML = ""; vic.innerHTML = "";
  rnd = (function (s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; })(11);
  /* i primi 6 posti stanno a destra, lontani dai testi; gli ultimi servono solo con pioggia e temporale (nubi scure) */
  const posti = [[250, 18, 1.1], [205, 96, .8], [318, 108, .75], [282, 162, .75], [190, 40, .7], [330, 62, .8], [-20, 232, .75], [10, 40, .9], [110, 118, 1.1]];
  /* le nubi chiare nascono a metà cielo (x 150) per non passare dietro alla temperatura; quelle scure attraversano tutto */
  const xMin = scuro ? -170 : 150, xMax = 420, L = xMax - xMin;
  /* vento da ovest (dir 180-360°) spinge verso destra; da est verso sinistra. Calma = lentissime */
  const indietro = dirVento != null && isFinite(dirVento) && dirVento > 0 && dirVento < 180;
  const v = Math.min(7, 0.9 + (vento || 0) * 0.13); /* unità al secondo */
  for (let i = 0; i < n && i < posti.length; i++) {
    const [x, y, s] = posti[i];
    const lontana = i % 2 === 0;
    const padre = lontana ? lont : vic;
    let d;
    if (STATICO) {
      d = el("g", { transform: `translate(${x} ${y})` }, padre);
    } else {
      const g = el("g", { transform: `translate(${xMin} ${y})` }, padre);
      d = el("g", { class: "vola" + (indietro ? " indietro" : "") }, g);
      const dur = L / (v * (lontana ? .72 : 1) * (.9 + rnd() * .2));
      const x0 = Math.max(xMin + 20, Math.min(xMax - 10, x));
      const frazione = indietro ? (xMax - x0) / L : (x0 - xMin) / L;
      d.style.setProperty("--L", L + "px");
      d.style.animationDuration = dur.toFixed(1) + "s";
      d.style.animationDelay = (-frazione * dur).toFixed(1) + "s";
    }
    el("use", { href: "#nube", width: 120 * s, height: 60 * s, opacity: scuro ? .95 : (lontana ? .9 : .97) }, d);
  }
}

/* ---------- mucche ---------- */
function mucca(padre, x, y, k, versoSx, macchia, i) {
  const base = el("g", { class: "mucca", transform: `translate(${x} ${y}) scale(${versoSx ? -k : k} ${k})` }, padre);
  const p = el("g", { class: "passo" }, base);
  p.style.animationDuration = (38 + i * 9) + "s";
  p.style.animationDelay = -(i * 13) + "s";
  el("ellipse", { cx: 0, cy: .4, rx: 10.5, ry: 1.6, fill: "#000", opacity: .13 }, p);
  /* zampe */
  [[-7.4, "#E4DCCF"], [-4.4, "#FBF7F0"], [3.6, "#E4DCCF"], [6.2, "#FBF7F0"]].forEach(([lx, c]) => {
    el("rect", { x: lx, y: -6, width: 1.9, height: 6, rx: .6, fill: c }, p);
    el("rect", { x: lx, y: -1.1, width: 1.9, height: 1.1, fill: "#4A3A30" }, p);
  });
  /* coda */
  const cg = el("g", { transform: "translate(-9.4 -11)" }, p);
  const coda = el("g", { class: "coda" }, cg);
  coda.style.animationDelay = -(i * 1.3) + "s";
  el("path", { d: "M0 0 Q-2.4 3.4 -1.8 7.4", fill: "none", stroke: "#E4DCCF", "stroke-width": 1, "stroke-linecap": "round" }, coda);
  el("ellipse", { cx: -1.8, cy: 7.9, rx: 1, ry: 1.5, fill: macchia }, coda);
  /* corpo con macchie */
  el("rect", { x: -10, y: -13, width: 18.5, height: 8.5, rx: 4, fill: "#FBF7F0" }, p);
  const m = el("g", { "clip-path": "url(#corpoMucca)", fill: macchia }, p);
  el("ellipse", { cx: -4.2, cy: -11.6, rx: 3.8, ry: 2.8 }, m);
  el("ellipse", { cx: 3, cy: -6, rx: 3.2, ry: 2.3 }, m);
  el("ellipse", { cx: -9.5, cy: -7, rx: 2.4, ry: 2.6 }, m);
  el("ellipse", { cx: 2.6, cy: -4.3, rx: 1.9, ry: 1.1, fill: "#F3B5B0" }, p);
  /* testa: ruota intorno al collo per brucare */
  const tg = el("g", { transform: "translate(6.6 -10.6)" }, p);
  const t = el("g", { class: "testa" + (i === 1 ? " giu" : "") }, tg);
  t.style.animationDuration = (10 + i * 2.7).toFixed(1) + "s";
  t.style.animationDelay = -(i * 4.1).toFixed(1) + "s";
  el("path", { d: "M-2 -2.4 L3.6 -2.6 L4.2 2.6 L-1.4 3.4 Z", fill: "#FBF7F0" }, t);
  el("path", { d: "M3.6 -3.4 L3 -5.2 M6.4 -3.4 L7 -5.2", stroke: "#EFE3C2", "stroke-width": .9, "stroke-linecap": "round" }, t);
  el("ellipse", { cx: 2.4, cy: -2.6, rx: 1.7, ry: .85, fill: macchia, transform: "rotate(-20 2.4 -2.6)" }, t);
  el("rect", { x: 2.6, y: -3.4, width: 5.2, height: 5.6, rx: 2.3, fill: "#FBF7F0" }, t);
  el("path", { d: "M3 -2.6 C4 -3.6 6.6 -3.6 7.4 -2.4 L5.4 -.6 Z", fill: macchia }, t);
  el("rect", { x: 5.6, y: -.4, width: 3.4, height: 3.2, rx: 1.5, fill: "#F3B5B0" }, t);
  el("circle", { cx: 8, cy: .9, r: .4, fill: "#B9726C" }, t);
  el("circle", { cx: 5, cy: -1, r: .6, fill: "#2A2220" }, t);
  el("path", { d: "M1.4 2.2 L3.6 2", stroke: "#B5452F", "stroke-width": .7 }, t);
  el("circle", { cx: 2.6, cy: 3.1, r: 1.15, fill: "#E9B949", stroke: "#B78A26", "stroke-width": .4 }, t);
}
(function costruisciMucche() {
  const g = $("mucche");
  /* [x, y, scala, verso sinistra, colore macchie] */
  [[100, 295.5, 1.3, false, "#6E3F22"], [150, 290.5, 1.15, true, "#2B2A2C"], [184, 297.5, 1.25, true, "#8A5530"], [63, 291.5, 1.1, false, "#2B2A2C"]]
    .forEach(([x, y, k, sx, c], i) => mucca(g, x, y, k, sx, c, i));
})();

function precipitazione(tipo, n) {
  const box = $("precip");
  box.className = "precip"; box.innerHTML = "";
  if (!tipo || !n) return;
  box.classList.add(tipo === "neve" ? "neve" : "pioggia");
  if (tipo === "pioviggine") box.classList.add("pioviggine");
  const H = scena.offsetHeight * 1.2 + 40;
  box.style.setProperty("--h", H + "px");
  const r = (function (s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; })(3);
  let html = "";
  for (let i = 0; i < Math.min(n, 60); i++) {
    const x = (r() * 100).toFixed(1);
    const top = STATICO ? (r() * 95).toFixed(1) + "%" : "-8%";
    if (tipo === "neve") {
      const sz = (3 + r() * 4).toFixed(1), dur = (6 + r() * 6).toFixed(2);
      html += `<span style="left:${x}%;top:${top};width:${sz}px;height:${sz}px;opacity:${(.65 + r() * .35).toFixed(2)};animation-duration:${dur}s;animation-delay:-${(r() * dur).toFixed(2)}s"></span>`;
    } else {
      const dur = (tipo === "pioviggine" ? 1.3 : .75) + r() * .45;
      html += `<span style="left:${x}%;top:${top};animation-duration:${dur.toFixed(2)}s;animation-delay:-${(r() * dur).toFixed(2)}s;opacity:${(.5 + r() * .5).toFixed(2)}"></span>`;
    }
  }
  box.innerHTML = html;
}

function posizionaAstro(id, p, x0, x1) {
  /* arco: da sinistra a destra, alto al centro */
  p = Math.max(0, Math.min(1, p));
  const x = x0 + (x1 - x0) * p, y = Math.min(150, 205 - Math.sin(Math.PI * p) * 160); /* vicino all'orizzonte resta appena sopra le creste */
  $(id).setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
}
function faseLuna(ms) {
  const eta = ((ms / 86400000 - 10962.76) % 29.530589 + 29.530589) % 29.530589;
  return eta / 29.530589; /* 0 nuova, .5 piena */
}

function disegnaScena(st) {
  const t = Object.assign({}, TAV[st.tav]);
  if (st.suoloNeve) Object.assign(t, st.notte ? NEVE_SUOLO_NOTTE : NEVE_SUOLO);
  const root = document.documentElement.style;
  ["s1", "s2", "s3", "roccia", "roccia2", "cima", "colle", "pino", "prato", "prato2", "nube", "nube2", "nebbia"].forEach(k => root.setProperty("--" + k, t[k]));
  scena.style.background = t.s2;
  document.body.style.background = "";
  root.setProperty("--bg", t.bg);
  document.body.classList.toggle("scuro", !!t.scuro);
  if (t.scuro) root.setProperty("--bg", t.bg);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", t.s1);
  const sopra = $("sopra");
  const inkScuro = t.ink !== "#fff";
  root.setProperty("--ink", t.ink);
  sopra.classList.toggle("chiaro-ombra", !inkScuro);
  sopra.classList.toggle("ink-scuro", inkScuro);

  /* stelle, sole, luna */
  $("stelle").style.display = st.notte && st.nuvole < 85 ? "" : "none";
  $("stelle").style.opacity = st.notte ? (1 - st.nuvole / 100 * .8) : 0;
  const soleV = !st.notte && st.nuvole < 92 && !st.cupo;
  $("sole").style.display = soleV ? "" : "none";
  $("sole").style.opacity = st.nuvole > 70 ? .55 : 1;
  $("luna").style.display = st.notte && st.nuvole < 92 && !st.cupo ? "" : "none";
  if (st.notte) posizionaAstro("luna", st.pAstro, 100, 332); else posizionaAstro("sole", st.pAstro, 100, 332);
  const f = faseLuna(st.ms);
  /* ombra: si sposta a sinistra in fase crescente, rientra da destra in calante */
  const dx = f < .5 ? -f * 4 * 15.5 : (1 - f) * 4 * 15.5;
  $("ombraLuna").setAttribute("cx", dx.toFixed(1));
  $("ombraLuna").setAttribute("fill", t.s1);

  ultimaScena = st;
  nubi(st.nNubi, st.cupo, st.vento, st.dirVento);
  $("nebbie").classList.toggle("nascosto", !st.nebbia);
  $("fulmini").classList.toggle("nascosto", !st.temporale);
  $("flash").classList.toggle("attivo", st.temporale && !STATICO);
  precipitazione(st.precTipo, st.precN);

  /* casa: finestre accese di sera, neve sul tetto */
  const accese = st.notte || st.tav === "tramonto" || st.tav === "temporale" || st.tav === "pioggia" && st.cupo;
  document.querySelectorAll("#casa .fin").forEach(f => f.setAttribute("fill", accese ? "#FFD36B" : "#3E5266"));
  $("luceCasa").setAttribute("opacity", st.notte ? 1 : accese ? .5 : 0);
  $("tettoNeve").setAttribute("opacity", st.suoloNeve ? 1 : 0);

  /* stalla: porte aperte quando le mucche sono fuori, finestra accesa la sera */
  $("mucche").style.display = st.mucche ? "" : "none";
  $("porteAperte").style.display = st.mucche ? "" : "none";
  $("porteChiuse").style.display = st.mucche ? "none" : "";
  document.querySelectorAll("#stalla .fin-stalla").forEach(f => f.setAttribute("fill", accese ? "#FFD36B" : "#3E5266"));
  $("luceStalla").setAttribute("opacity", st.notte ? .8 : accese ? .4 : 0);
  $("stallaNeve").setAttribute("opacity", st.suoloNeve ? 1 : 0);

  /* trattore: di giorno va avanti e indietro; di notte o col brutto tempo è parcheggiato vicino alla stalla */
  const tr = $("trattore");
  tr.classList.toggle("fermo", !st.trattoreVa);
  tr.classList.toggle("fari", st.trattoreVa && st.fari);
  tr.setAttribute("transform", st.trattoreVa ? "translate(78 311) scale(1.25)" : "translate(158 294) scale(1.15)");
  if (st.notte) tr.setAttribute("filter", "url(#buio)"); else tr.removeAttribute("filter");
  tr.querySelector(".vetro").setAttribute("fill", st.trattoreVa ? "#CFE8F5" : "#56697C");
  /* l'autista c'è solo quando il trattore lavora */
  tr.querySelectorAll(".autista").forEach(a => a.style.display = st.trattoreVa ? "" : "none");
}

function statoScena(c, giorno, nuvole, ms, ora, alba, tramonto, albaDomani, neveOggi) {
  const st = { notte: !giorno, nuvole, ms };
  st.temporale = eTemporale(c);
  st.nebbia = c === 45 || c === 48;
  st.suoloNeve = eNeve(c) || neveOggi > 0;
  if (eNeve(c)) { st.precTipo = "neve"; st.precN = c === 71 || c === 77 || c === 85 ? 24 : c === 73 ? 38 : 56; }

  else if (ePioggia(c) || st.temporale) { st.precTipo = "pioggia"; st.precN = c === 61 || c === 80 ? 30 : c === 65 || c === 82 || st.temporale ? 60 : 44; }

  if (c === 0) n = Math.min(n, 1);
  if (c === 1) n = Math.min(Math.max(n, 1), 2);
  if (c === 2) n = Math.min(Math.max(n, 3), 4);

  st.nNubi = n;

  const vicinoTramonto = giorno && (Math.abs(ora - tramonto) <= 50 || Math.abs(ora - alba) <= 40);
  if (st.temporale) st.tav = giorno ? "temporale" : "notteGrigia";
  else if (!giorno) st.tav = nuvole > 70 || ePrecip(c) || st.nebbia ? "notteGrigia" : "notte";
  else if (eNeve(c)) st.tav = "neve";
  else if (ePrecip(c)) st.tav = "pioggia";
  else if (st.nebbia) st.tav = "nebbia";
  else if (vicinoTramonto && nuvole < 85) st.tav = "tramonto";
  else if (nuvole > 70 || c === 3) st.tav = "nuvoloso";

}

/* ---------- frase semplice sulle prossime ore ---------- */
function frase(d, i0) {
  const H = d.hourly, cur = d.current, N = Math.min(12, H.time.length - i0 - 1);
  const bagnata = h => (H.precipitation[h] || 0) >= 0.1 || (ePrecip(H.weather_code[h]) && (H.precipitation_probability[h] || 0) >= 40);
  const oraNow = (cur.precipitation || 0) > 0 || ePrecip(cur.weather_code);
  const neveOra = eNeve(cur.weather_code);
  let parte = "";
  /* ore di domani (dopo le 6): si aggiunge "di domani" */
  const dd = i => H.time[i].substr(0, 10) !== cur.time.substr(0, 10) && hh(H.time[i]) >= 6 ? " di domani" : "";
  if (oraNow) {
    const cosa = eTemporale(cur.weather_code) ? "Temporale in corso" : neveOra ? "Sta nevicando" : (cur.weather_code >= 51 && cur.weather_code <= 57) ? "Pioviggina" : "Sta piovendo";
    let fine = -1;
    for (let k = 1; k <= N; k++) if (!bagnata(i0 + k)) { fine = i0 + k; break; }
    if (fine < 0) parte = cosa + (neveOra ? ", e continuerà per tutte le prossime ore." : ", e continuerà per tutte le prossime ore.");
    else {
      let ripresa = -1;
      for (let k = fine - i0 + 1; k <= N; k++) if (bagnata(i0 + k)) { ripresa = i0 + k; break; }
      parte = cosa + " " + finoAlle(hh(H.time[fine])) + dd(fine) + (ripresa > 0 ? ", poi una pausa e di nuovo " + (eNeve(H.weather_code[ripresa]) ? "neve" : "pioggia") + " " + dalle(hh(H.time[ripresa])) + dd(ripresa) + "." : ", poi smette.");
    }
  } else {
    let inizio = -1;
    for (let k = 1; k <= N; k++) if (bagnata(i0 + k)) { inizio = i0 + k; break; }
    if (inizio > 0) {
      const c = H.weather_code[inizio];
      const cosa = eTemporale(c) ? "temporali" : eNeve(c) ? "neve" : "pioggia";
      parte = (cosa === "neve" ? "Per ora non nevica: neve " : cosa === "temporali" ? "Per ora asciutto: temporali " : "Per ora asciutto: pioggia ") + dalle(hh(H.time[inizio])) + dd(inizio) + (H.precipitation_probability[inizio] >= 30 ? " (" + H.precipitation_probability[inizio] + "%)." : ".");
    } else {
      let pmax = 0;
      for (let k = 1; k <= N; k++) pmax = Math.max(pmax, H.precipitation_probability[i0 + k] || 0);
      parte = pmax >= 25 ? "Probabilmente asciutto, ma con un po' di rischio pioggia (fino al " + pmax + "%)." : "Niente pioggia nelle prossime 12 ore.";
      /* temperatura */
      let imax = i0, imin = i0;
      for (let k = 1; k <= N; k++) { if (H.temperature_2m[i0 + k] > H.temperature_2m[imax]) imax = i0 + k; if (H.temperature_2m[i0 + k] < H.temperature_2m[imin]) imin = i0 + k; }
      if (H.temperature_2m[imax] - cur.temperature_2m >= 2) parte += " Fino a " + r0(H.temperature_2m[imax]) + "° " + verso(hh(H.time[imax])) + dd(imax) + ".";
      else if (cur.temperature_2m - H.temperature_2m[imin] >= 3) parte += " In calo fino a " + r0(H.temperature_2m[imin]) + "° " + verso(hh(H.time[imin])) + dd(imin) + ".";
    }
  }
  return parte;
}

/* ---------- dati di prova: ?prova=sereno|pioggia|neve|temporale|notte|nebbia|tramonto ---------- */
function datiProva(tipo) {

    neve:      { h: 10, m: 40, c: 73, cc: 100, base: -2, cod: h => h >= 6 && h < 17 ? 73 : 3, prec: h => h >= 6 && h < 17 ? .8 : 0, prob: h => h >= 6 && h < 17 ? 90 : 30, neve: 14 },
    temporale: { h: 15, m: 5, c: 95, cc: 100, base: 21, cod: h => h >= 14 && h < 17 ? 95 : h >= 17 && h < 19 ? 61 : 2, prec: h => h >= 14 && h < 19 ? 4 : 0, prob: h => h >= 13 && h < 19 ? 80 : 15, neve: 0 },
    notte:     { h: 22, m: 15, c: 0, cc: 10, base: 2, cod: () => 0, prec: () => 0, prob: () => 0, neve: 0, notte: true },
    coperto:   { h: 12, m: 5, c: 3, cc: 100, base: 6, cod: () => 3, prec: () => 0, prob: () => 10, neve: 0 },
    nebbia:    { h: 8, m: 30, c: 45, cc: 100, base: 3, cod: h => h < 11 ? 45 : 2, prec: () => 0, prob: () => 5, neve: 0 },
    tramonto:  { h: 16, m: 25, c: 1, cc: 25, base: 7, cod: () => 1, prec: () => 0, prob: () => 5, neve: 0 }
  }[tipo];
  if (!cfg) return null;
  const time = [], t2 = [], pp = [], pr = [], wc = [], isd = [];
  for (let k = 0; k < 10; k++) for (let h = 0; h < 24; h++) {
    time.push(giorno(k) + "T" + pad(h) + ":00");
    const diurno = Math.sin(Math.PI * Math.max(0, Math.min(1, (h - 7) / 11)));
    t2.push(cfg.base - 3 + diurno * 6 + Math.sin((k * 24 + h) / 24 * 1.3) * 3);
    const own = k === 0;
    const cg = [2, 61, 3, 0, 1, 80, 71, 2, 0, 3][k], bag = ePrecip(cg) && h >= 13 && h < 19;
    wc.push(own ? cfg.cod(h) : bag || !ePrecip(cg) ? cg : 3);
    pr.push(own ? cfg.prec(h) : bag ? 1 : 0); pp.push(own ? cfg.prob(h) : bag ? [10, 70, 30, 0, 5, 60, 55, 20, 0, 15][k] : 10);
    isd.push(h >= 8 && h < 17 ? 1 : 0);
  }
  const ct = giorno(0) + "T" + pad(cfg.h) + ":" + pad(cfg.m);
  const ix = cfg.h;
  return {
    utc_offset_seconds: 3600,
    current: { time: ct, temperature_2m: t2[ix], apparent_temperature: t2[ix] - 2.5, relative_humidity_2m: 80, weather_code: cfg.c, is_day: cfg.notte ? 0 : 1, precipitation: cfg.prec(cfg.h), cloud_cover: cfg.cc, wind_speed_10m: tipo === "temporale" ? 34 : 9, wind_direction_10m: 250, wind_gusts_10m: tipo === "temporale" ? 68 : 22 },
    hourly: { time, temperature_2m: t2, precipitation_probability: pp, precipitation: pr, weather_code: wc, is_day: isd },
    daily: {
      time: Array.from({ length: 10 }, (_, k) => giorno(k)),
      weather_code: [cfg.c, 61, 3, 0, 1, 80, 71, 2, 0, 3],
      temperature_2m_max: Array.from({ length: 10 }, (_, k) => Math.max(...t2.slice(k * 24, k * 24 + 24))),
      temperature_2m_min: Array.from({ length: 10 }, (_, k) => Math.min(...t2.slice(k * 24, k * 24 + 24))),
      precipitation_probability_max: [Math.max(...pp.slice(0, 24)), 70, 30, 0, 5, 60, 55, 20, 0, 15],
      sunrise: Array.from({ length: 10 }, (_, k) => giorno(k) + "T07:28"), sunset: Array.from({ length: 10 }, (_, k) => giorno(k) + "T16:42"),
      uv_index_max: [tipo === "sereno" ? 2.4 : 1.1, 1, 2, 2.3, 2, 1, 1, 2, 2, 1],
      snowfall_sum: [cfg.neve, 0, 0, 0, 0, 0, 4, 0, 0, 0]
    }
  };
}

/* ---------- caricamento ---------- */
async function json(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function carica() {
  const prova = P.get("prova");
  const fx = prova ? datiProva(prova) : null;
  if (fx) {
    $("agg").textContent = "";
    disegna(fx, { sereno: 14, pioggia: 9, neve: 12, coperto: 31, temporale: 46, notte: 23, nebbia: 52, tramonto: 28 }[prova]);
    $("agg").textContent = "Prova: " + prova + " · dati finti";
    return;
  }
  const ll = "latitude=" + LUOGO.lat + "&longitude=" + LUOGO.lon;
  const urlM = "https://api.open-meteo.com/v1/forecast?" + ll + "&timezone=auto&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,precipitation,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max,snowfall_sum&forecast_days=10";
  const urlA = "https://air-quality-api.open-meteo.com/v1/air-quality?" + ll + "&timezone=auto&current=european_aqi&forecast_days=1";
  /* come Promise.allSettled, ma compatibile con iOS 12 (iPad vecchi): altrimenti il caricamento resta fermo */
  const [m, a] = await Promise.all([json(urlM), json(urlA)].map(p => p.then(value => ({ status: "fulfilled", value }), reason => ({ status: "rejected", reason }))));
  if (m.status !== "fulfilled" || !m.value || !m.value.current) {
    errore(navigator.onLine === false ? "Sembra che il telefono sia senza rete. Riprova tra poco." : "Il servizio meteo non ha risposto. Riprova tra poco.");
    return;
  }
  const aria = a.status === "fulfilled" && a.value && a.value.current ? a.value.current.european_aqi : null;
  try { disegna(m.value, aria); }
  catch (e) { console.error(e); errore("Qualcosa è andato storto nel leggere i dati."); }
}
/* un solo ascoltatore (il contenuto si ridisegna a ogni aggiornamento): giorno toccato → pop-up del giorno */
$("contenuto").addEventListener("click", e => {
  const b = e.target.closest("[data-giorno]");
  if (!b || !window.MeteoGiorno) return;
  MeteoGiorno.apri({ lat: LUOGO.lat, lon: LUOGO.lon, nome: LUOGO.nome, data: b.dataset.giorno });
});
carica();
/* aggiorna ogni 15 minuti quando la pagina è aperta */
setInterval(() => { if (!document.hidden && !P.get("prova")) carica(); }, 15 * 60 * 1000);
</script>
